<!-- Ember by Victoria Lewis: Spark Setup Audit. Paste into a full-width GHL Custom Code element. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;700;900&family=Livvic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
.esa,.esa *,.esa *::before,.esa *::after{box-sizing:border-box;margin:0;padding:0}
.esa{background:#2a140c;color:#f2e1cd;font-family:'Livvic',sans-serif;font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;overflow-x:clip}
.esa a{color:#c75c33;text-decoration:none}
.esa button{font-family:'Livvic',sans-serif}
.esa h1,.esa h2,.esa h3{font-family:'Chivo',sans-serif;font-weight:900;color:inherit}
.esa-wrap{max-width:1100px;margin:0 auto;width:100%}
.esa-head{border-bottom:1px solid rgba(242,225,205,0.08)}
.esa-head-in{max-width:1100px;margin:0 auto;padding:18px clamp(20px,5vw,56px);display:flex;align-items:center;justify-content:space-between;gap:16px}
.esa-brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.esa-badge{font-size:0.62rem;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;background:#c75c33;color:#f2e1cd;padding:4px 10px;border-radius:100px}
.esa-bar{height:4px;background:rgba(242,225,205,0.08)}
.esa-bar span{display:block;height:4px;background:#c75c33;transition:width .4s cubic-bezier(.2,.7,.2,1)}
.esa-kicker{display:block;font-size:0.72rem;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:#c75c33}
.esa-hl{color:#c75c33}
.esa-glow{position:relative}
.esa-glow::before{content:"";position:absolute;top:-10%;right:-15%;width:70vw;height:70vw;max-width:900px;max-height:900px;background:radial-gradient(circle,rgba(199,92,51,0.22) 0%,rgba(199,92,51,0) 62%);pointer-events:none}
.esa-glow>*{position:relative}
.esa-btn{display:inline-flex;align-items:center;justify-content:center;min-height:58px;padding:0 36px;border-radius:100px;border:none;cursor:pointer;background:linear-gradient(180deg,#d4683d 0%,#c75c33 100%);color:#f2e1cd !important;font-size:1rem;font-weight:600;letter-spacing:0.02em;box-shadow:0 10px 30px -10px rgba(199,92,51,0.7),inset 0 1px 0 rgba(255,255,255,0.18);transition:transform .2s}
.esa-btn:hover{transform:translateY(-2px)}
.esa-btn-dark{background:#2a140c;box-shadow:0 12px 30px -12px rgba(42,20,12,0.7)}
.esa-link{background:none;border:none;border-bottom:1px solid rgba(242,225,205,0.35);padding:0 0 2px;cursor:pointer;font-size:1rem;font-weight:600;color:#f2e1cd}
.esa-link:hover{color:#c75c33}
.esa-back{background:none;border:none;cursor:pointer;font-size:0.9rem;font-weight:600;color:rgba(242,225,205,0.6);padding:10px 0;min-height:44px}
.esa-back:hover{color:#c75c33}
.esa-opt{display:flex;align-items:center;gap:16px;width:100%;min-height:60px;padding:14px 20px;border-radius:18px;cursor:pointer;text-align:left;font-size:1.05rem;font-weight:500;line-height:1.45;color:#f2e1cd;background:rgba(242,225,205,0.04);border:1.5px solid rgba(242,225,205,0.14);transition:border-color .2s,background .2s}
.esa-opt:hover{border-color:#c75c33}
.esa-opt i{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(242,225,205,0.4);box-shadow:inset 0 0 0 4px #2a140c}
.esa-opt.on{background:rgba(199,92,51,0.16);border-color:#c75c33}
.esa-opt.on i{border-color:#c75c33;background:#c75c33}
.esa textarea{width:100%;padding:18px 20px;border-radius:18px;background:rgba(242,225,205,0.05);border:1.5px solid rgba(242,225,205,0.18);color:#f2e1cd;font-family:'Livvic',sans-serif;font-size:1.05rem;line-height:1.6;resize:vertical}
.esa textarea:focus{outline:none;border-color:#c75c33}
.esa-sec{padding:clamp(64px,9vw,120px) clamp(20px,5vw,56px)}
.esa-cream{background:#f2e1cd;color:#2a140c}
.esa-grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.esa-card{display:flex;flex-direction:column;padding:clamp(24px,3.5vw,36px);border-radius:28px;background:#fff;border:1px solid rgba(42,20,12,0.1)}
.esa-card.first{border:1.5px solid #c75c33}
.esa-card .lab{font-size:0.68rem;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#c75c33}
.esa-card .blk{margin-top:16px;padding-top:16px;border-top:1px solid rgba(42,20,12,0.1)}
.esa-card p{font-size:0.98rem;line-height:1.6;color:rgba(42,20,12,0.85)}
.esa-vid{margin-top:24px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:12px 20px;border-radius:16px;background:#2a140c;color:#f2e1cd !important;font-weight:600;font-size:0.95rem;line-height:1.35}
.esa-vid:hover{background:#c75c33}
.esa-row{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid rgba(242,225,205,0.12);color:#f2e1cd !important;min-height:56px}
.esa-row:hover{color:#c75c33 !important}
.esa-plan{padding:clamp(28px,4vw,44px);border-radius:28px;background:radial-gradient(ellipse at 100% 0%,rgba(199,92,51,0.35) 0%,rgba(199,92,51,0) 60%),rgba(242,225,205,0.06);box-shadow:inset 0 0 0 1.5px rgba(199,92,51,0.75)}
.esa-cta{position:relative;background:#c75c33;text-align:center;overflow:hidden;padding:clamp(80px,11vw,140px) clamp(20px,5vw,56px)}
.esa-cta::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(242,225,205,0.18) 0%,rgba(242,225,205,0) 60%),radial-gradient(ellipse at 0% 100%,rgba(42,20,12,0.22) 0%,rgba(42,20,12,0) 60%);pointer-events:none}
.esa-cta>*{position:relative}
.esa-cta .esa-link{border-color:rgba(242,225,205,0.6)}
.esa-cta .esa-link:hover{color:#2a140c}
</style>

<div class="esa" id="esa"></div>

<script>
(function(){
  /* ===== Settings: fill these in ===== */
  var WEBHOOK_URL = '';   /* GHL inbound webhook (Automation > Workflow > Inbound Webhook trigger) */
  var UPGRADE_URL = '';   /* Spark Plus checkout link */
  var VIDEOS_URL  = '';   /* Course page. Each video button adds ?topic=onb etc. */
  var MODE        = 'self'; /* 'self' or 'call'. A ?mode= in the link overrides this. */
  /* =================================== */

  var AREAS = [{"id":"lm","name":"Lead magnet","phrase":"creating a lead magnet","video":"How to create a lead magnet","sec":"Getting found","auto":"A freebie that collects their details and lands in their inbox straight away.","human":"Making it genuinely useful for the people you most want to work with.","qs":[["Do you have something that gets people onto your email list?",["No","Just a subscribe box","A freebie, but I send it out by hand","A freebie that delivers itself"]],["How do people find out about your freebie?",["I don't have one","It's on my website somewhere","I mention it now and then","It's on my site, socials and emails as standard"]],["How many new subscribers do you get in a typical month?",["Hardly any","A handful","A steady trickle","Plenty, and it's growing"]]]},{"id":"nur","name":"Welcome emails","phrase":"welcome emails","video":"How to write and set up a welcome series","sec":"Getting found","auto":"A welcome series that goes out in order, so every new subscriber gets to know you.","human":"Writing it in your own voice, so it sounds like you.","qs":[["What happens after someone joins your list?",["Nothing","They get my newsletter when I remember","A short welcome email","A welcome series that leads to a booking or sale"]],["How often do you email your list?",["Rarely or never","When I have something to sell","Most months","On a regular schedule"]],["Do different people get different emails?",["No, everyone gets the same","I've thought about it","I have a couple of lists","Emails are tailored to their interests or stage"]]]},{"id":"enq","name":"Enquiries","phrase":"replying to enquiries","video":"How to set up your enquiry form and instant reply","sec":"Enquiries and sales","auto":"An instant reply so nobody waits, with their details saved in one place.","human":"A personal reply once you know what they need.","qs":[["When someone enquires, what happens next?",["I reply when I spot it","I reply by hand, usually the same day","I use saved replies","They get an instant reply and their details are saved for me"]],["Where do your enquiries come in?",["All over: email, DMs, phone and texts","Mostly email, but scattered","Mostly through one form","Everything lands in one place"]],["Do you know where each enquiry came from?",["No idea","A rough guess","I ask each one","It's tracked automatically"]]]},{"id":"book","name":"Bookings","phrase":"bookings and reminders","video":"How to set up your calendar and reminders","sec":"Enquiries and sales","auto":"A booking link with confirmations and reminders that send themselves.","human":"Turning up to the call prepared and focused on them.","qs":[["How do people book a call or appointment with you?",["Lots of back-and-forth emails","I send them some times by hand","A booking link, but I send reminders myself","A booking link with automatic confirmations and reminders"]],["How often do people miss or forget a call?",["Often","Now and then","Rarely","Hardly ever, the reminders handle it"]],["Do you find out what they need before the call?",["No, I go in cold","I ask a few questions by email","A form, but I have to chase it","A form is part of booking and I read it beforehand"]]]},{"id":"fol","name":"Follow-up","phrase":"following up leads","video":"How to build a follow-up sequence","sec":"Enquiries and sales","auto":"Friendly follow-ups that go out when someone goes quiet.","human":"Picking up the conversation yourself as soon as they reply.","qs":[["What happens when someone goes quiet after enquiring?",["Nothing, they slip away","I chase when I remember","I set myself reminders to chase","A follow-up goes out automatically and I step in when they reply"]],["What happens after a sales call?",["I wait for them to get back to me","I send a follow-up when I can","I send a templated follow-up","A follow-up with next steps goes out automatically"]],["How many leads do you think slip through the cracks?",["Lots, but I couldn't say how many","Some","A few","Hardly any"]]]},{"id":"pipe","name":"Sales pipeline","phrase":"managing your sales pipeline","video":"How to set up your pipeline","sec":"Enquiries and sales","auto":"Leads that move through your pipeline as they book, reply or pay.","human":"The conversations that turn a maybe into a yes.","qs":[["How do you keep track of who is at what stage?",["In my head","A list or spreadsheet","A pipeline I update by hand","A pipeline that updates as people book, reply or pay"]],["Can you see at a glance how much work is coming in?",["No","I'd have to work it out","Roughly","Yes, in one view"]],["What happens when someone moves to the next stage?",["Nothing unless I do it","I update my notes","I move them and send what's next by hand","The next steps happen automatically"]]]},{"id":"prop","name":"Proposals and contracts","phrase":"proposals and contracts","video":"How to set up proposals, contracts and deposits","sec":"Enquiries and sales","auto":"Proposal and contract templates that send, get signed and take a deposit in one go.","human":"Talking it through with them so the proposal lands well.","qs":[["How do you send proposals or quotes?",["I write each one from scratch","I copy an old one and edit it","I use a template","Templates that send and track themselves"]],["How do clients sign and pay a deposit?",["Lots of back and forth","They email it back and I invoice","They e-sign, then I invoice separately","They sign and pay in one step"]],["Do you know when someone has opened your proposal?",["No","Only if I ask them","Sometimes","Yes, and it sets off a follow-up"]]]},{"id":"onb","name":"Onboarding","phrase":"onboarding","video":"How to automate your onboarding","sec":"Working together","auto":"Welcome emails, forms and contracts that go out the moment someone says yes, so you have everything you need to start.","human":"A welcome call or personal note so they feel looked after from day one.","qs":[["When a new client says yes, what happens?",["I work it out each time","I follow a checklist by hand","Some of the emails are templated","Welcome emails, forms and contracts go out automatically"]],["How do you collect what you need from a new client?",["I chase it over email","I send a list and wait","A form, but I have to chase it","A form that reminds them until it's done"]],["How long does it take you to get a new client started?",["Days, it's all by hand","A good few hours","An hour or so","Minutes, it mostly runs itself"]]]},{"id":"inv","name":"Invoicing","phrase":"invoicing and payments","video":"How to set up invoices and payment reminders","sec":"Working together","auto":"Invoices and payment reminders that send themselves.","human":"A friendly word if something needs sorting.","qs":[["How do you invoice and get paid?",["Manually, and I chase","An invoice tool, but I chase by hand","Invoices go out on time, reminders are manual","Invoices and reminders send themselves"]],["How often are you paid late?",["Often","Now and then","Rarely","Hardly ever"]],["Can clients pay online straight from the invoice?",["No","Bank details only","Yes, for some invoices","Yes, by card or direct debit"]]]},{"id":"upd","name":"Client updates","phrase":"keeping clients updated","video":"How to set up client update emails","sec":"Working together","auto":"Updates at the key points so clients always know where things are.","human":"Personal check-ins at the moments that matter to them.","qs":[["How do clients know what's happening while you work with them?",["They ask me","I update them when I can","I send updates at set points by hand","Key updates go out automatically and I add personal check-ins"]],["How often do clients chase you for an update?",["All the time","Fairly often","Occasionally","Hardly ever"]],["How do you wrap up when the work is finished?",["It just sort of ends","I send a final email","I follow a checklist by hand","A wrap-up sequence goes out automatically"]]]},{"id":"rev","name":"Reviews","phrase":"asking for reviews","video":"How to automate review requests","sec":"After the work","auto":"A review request that goes out at the right moment after you finish.","human":"A personal thank you for their time.","qs":[["How do you ask for reviews or testimonials?",["I don't","Now and then, when I remember","I ask everyone, by hand","A request goes out automatically at the right moment"]],["Where do your reviews live?",["I don't really have any","Scattered across emails and messages","In one place, like Google","In one place, and I use them on my site and socials"]],["What happens with client feedback?",["I don't ask for it","I ask in conversation","I send a survey by hand","It is collected automatically and I act on it"]]]},{"id":"past","name":"Past clients","phrase":"staying in touch with past clients","video":"How to set up past client check-ins","sec":"After the work","auto":"Check-ins that go out at the right time after you finish working together.","human":"Remembering what matters to them and picking up where you left off.","qs":[["How do you stay in touch with past clients?",["I don't really","When I remember","They get my newsletter","Check-ins and offers go out at the right time"]],["Do you know when a past client might need you again?",["No","I'd have to think about it","Roughly","Yes, I have reminders set up"]],["Do you ask for referrals?",["Never","Occasionally","I ask happy clients by hand","Referral requests go out at the right time"]]]}];
  var Q = [];
  AREAS.forEach(function(a){ a.qs.forEach(function(x, i){ Q.push({ id: a.id + (i + 1), sec: a.sec + ' · ' + a.name, q: x[0], o: x[1] }); }); });
  Q.push({ id: 'hours', sec: 'Your time', q: 'Roughly how many hours a week do you spend on admin?', o: ['Under 2 hours', '2 to 5 hours', '5 to 10 hours', 'More than 10 hours'] });
  Q.push({ id: 'pick', sec: 'Your priorities', q: 'Which of these would make the biggest difference to you right now?', o: AREAS.map(function(a){ return a.name; }), multi: true });
  Q.push({ id: 'open1', sec: 'Over to you', q: "What's the one thing you most want sorted?", text: true });
  Q.push({ id: 'open2', sec: 'Over to you', q: 'What have you tried already, and what got in the way?', text: true });

  var P = new URLSearchParams(location.search);
  var EMAIL = P.get('email') || '', CID = P.get('contact_id') || '', FIRST = P.get('first_name') || '';
  var PLAN = (P.get('plan') || 'monthly').toLowerCase() === 'annual' ? 'annual' : 'monthly';
  var CALL = (P.get('mode') || MODE).toLowerCase() === 'call';
  var KEY = 'ember-spark-audit-v3' + (CALL ? '-call-' + (EMAIL || CID || 'client') : '');
  var root = document.getElementById('esa');
  var S = { step: 0, ans: {}, sent: false };
  try { var sv = JSON.parse(localStorage.getItem(KEY)); if (sv) S = sv; } catch (e) {}
  if (!EMAIL && S.email) { EMAIL = S.email; FIRST = FIRST || S.first || ''; }

  function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
  function vid(id){ return VIDEOS_URL ? VIDEOS_URL + (VIDEOS_URL.indexOf('?') > -1 ? '&' : '?') + 'topic=' + id : '#'; }
  function roadmap(){
    var picks = Array.isArray(S.ans.pick) ? S.ans.pick : [];
    return AREAS.map(function(x, i){
      var vals = [1,2,3].map(function(n){ var v = S.ans[x.id + n]; return typeof v === 'number' ? v : 0; });
      var avg = (vals[0] + vals[1] + vals[2]) / 3;
      var picked = picks.indexOf(i) > -1;
      return { a: x, i: i, vals: vals, picked: picked, weakest: vals.indexOf(Math.min.apply(null, vals)), pct: Math.round(avg / 3 * 100), prio: (3 - avg) + (picked ? 0.75 : 0) };
    }).sort(function(x, y){ return (y.prio - x.prio) || (x.i - y.i); });
  }
  function fmt(q){
    var v = S.ans[q.id];
    if (q.text) return v || '';
    if (q.multi) return (v || []).map(function(i){ return q.o[i]; }).join(', ');
    return typeof v === 'number' ? q.o[v] : '';
  }
  function submit(){
    if (S.sent) return;
    var order = roadmap(), scores = {};
    order.forEach(function(x){ scores[x.a.id] = x.pct; });
    var payload = {
      email: EMAIL, contact_id: CID, plan: PLAN,
      mode: CALL ? 'call' : 'self', send_results_to: CALL ? 'viki' : 'client',
      top_three: order.slice(0, 3).map(function(x){ return x.a.name; }).join(', '),
      roadmap: order.map(function(x){ return x.a.name; }).join(' > '),
      admin_hours: fmt(Q[Q.length - 4]), priorities: fmt(Q[Q.length - 3]),
      most_want_sorted: S.ans.open1 || '', tried_already: S.ans.open2 || '',
      scores: scores,
      answers: Q.map(function(q){ return { section: q.sec, question: q.q, answer: fmt(q) }; }),
      quiz: 'Spark Setup Audit', first_name: FIRST,
      plan_name: PLAN === 'annual' ? 'Spark Plus' : 'Spark',
      scores_text: order.map(function(x){ return x.a.name + ' ' + x.pct; }).join(', '),
      answers_summary: Q.map(function(q){ return q.sec + '\n' + q.q + '\n' + (fmt(q) || '(skipped)'); }).join('\n\n')
    };
    order.forEach(function(x){ payload['score_' + x.a.id] = x.pct; });
    S.sent = true; save();
    if (WEBHOOK_URL) { try { fetch(WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), keepalive: true }); } catch (e) {} }
    else if (window.console) console.log('Spark audit payload (no webhook set):', payload);
  }
  function go(step){
    S.step = step; save();
    if (step === Q.length + 1 && (EMAIL || CID || CALL)) submit();
    render();
    try { window.scrollTo({ top: root.getBoundingClientRect().top + window.scrollY - 20, behavior: 'smooth' }); } catch (e) {}
  }

  function header(isQ){
    var h = '<header class="esa-head"><div class="esa-head-in"><div class="esa-brand">' +
      '<span style="font-family:Chivo,sans-serif;font-weight:900;font-size:1.15rem;letter-spacing:0.14em;text-transform:uppercase">Ember</span>' +
      '<span style="font-size:0.78rem;font-weight:500;color:#c75c33;letter-spacing:0.04em">Spark Setup Audit</span>' +
      (CALL ? '<span class="esa-badge">Call</span>' : '') + '</div>' +
      (isQ ? '<span style="font-size:0.85rem;color:rgba(242,225,205,0.6)">Question ' + S.step + ' of ' + Q.length + '</span>' : '') +
      '</div>';
    if (isQ) h += '<div class="esa-bar"><span style="width:' + Math.round((S.step - 1) / Q.length * 100) + '%"></span></div>';
    return h + '</header>';
  }
  function intro(){
    var started = Object.keys(S.ans).length > 0;
    return '<section class="esa-glow" style="flex:1;display:flex;align-items:center;padding:clamp(56px,10vw,120px) clamp(20px,5vw,56px)"><div style="max-width:820px;margin:0 auto;width:100%">' +
      '<div style="display:inline-flex;align-items:center;gap:10px;padding:7px 16px 7px 10px;border:1px solid rgba(199,92,51,0.5);border-radius:100px;background:rgba(199,92,51,0.08)"><span style="flex:none;width:8px;height:8px;border-radius:50%;background:#c75c33;box-shadow:0 0 0 4px rgba(199,92,51,0.2)"></span><span style="font-size:0.7rem;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#e0835c">For Spark members</span></div>' +
      '<h1 style="font-size:clamp(2.8rem,7vw,5.6rem);line-height:0.98;letter-spacing:-0.05em;margin-top:28px">Your roadmap for <span class="esa-hl">your new system.</span></h1>' +
      '<p style="margin-top:28px;font-size:clamp(1.08rem,1.8vw,1.3rem);line-height:1.65;color:rgba(242,225,205,0.88);max-width:620px">Tell me how you run things day to day. I\'ll show you what to automate first, so you get time back and can spend it where your clients really notice you.</p>' +
      '<p style="margin-top:14px;font-size:0.95rem;color:rgba(242,225,205,0.6)">It takes about 15 minutes. Your answers save as you go, so you can stop and come back to it.</p>' +
      '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;margin-top:36px">' +
      '<button class="esa-btn" data-act="start">' + (started ? 'Carry on →' : 'Start →') + '</button>' +
      (started ? '<button class="esa-link" data-act="restart">Start again</button>' : '') +
      '</div></div></section>';
  }
  function question(){
    var q = Q[S.step - 1], h = '';
    h += '<section style="flex:1;padding:clamp(40px,7vw,88px) clamp(20px,5vw,56px)"><div style="max-width:720px;margin:0 auto">' +
      '<button class="esa-back" data-act="back">← Back</button>' +
      '<span class="esa-kicker" style="margin-top:20px">' + esc(q.sec) + '</span>' +
      '<h2 style="font-size:clamp(1.9rem,4.4vw,3rem);line-height:1.08;letter-spacing:-0.04em;margin-top:14px">' + esc(q.q) + '</h2>';
    if (q.text) {
      h += '<div style="margin-top:36px"><textarea id="esa-ta" rows="5" placeholder="Type as much or as little as you like">' + esc(S.ans[q.id] || '') + '</textarea>' +
        '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;margin-top:20px"><button class="esa-btn" style="min-height:56px" data-act="next">' + (S.step === Q.length ? 'See my roadmap →' : 'Next →') + '</button>' +
        '<button class="esa-back" style="font-size:0.95rem" data-act="next">Skip</button></div></div>';
    } else {
      var picks = Array.isArray(S.ans.pick) ? S.ans.pick : [];
      h += '<div style="display:flex;flex-direction:column;gap:10px;margin-top:36px">';
      q.o.forEach(function(label, i){
        var on = q.multi ? picks.indexOf(i) > -1 : S.ans[q.id] === i;
        h += '<button class="esa-opt' + (on ? ' on' : '') + '" data-opt="' + i + '"><i></i><span>' + esc(label) + '</span></button>';
      });
      h += '</div>';
      if (q.multi) h += '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;margin-top:24px"><button class="esa-btn" style="min-height:56px" data-act="next">Next →</button><span style="font-size:0.9rem;color:rgba(242,225,205,0.6)">' + (picks.length ? picks.length + ' of 3 picked' : 'Pick up to three') + '</span></div>';
    }
    return h + '</div></section>';
  }
  function results(){
    var order = roadmap(), top = order.slice(0, 3), rest = order.slice(3);
    var hq = Q[Q.length - 4], hrs = typeof S.ans.hours === 'number' ? hq.o[S.ans.hours].toLowerCase() : '';
    var h = '<section class="esa-glow" style="padding:clamp(56px,9vw,112px) clamp(20px,5vw,56px) clamp(56px,8vw,96px)"><div class="esa-wrap">' +
      '<span class="esa-kicker">Your roadmap</span>' +
      '<h1 style="font-size:clamp(2.6rem,6.4vw,5.2rem);line-height:0.98;letter-spacing:-0.05em;margin-top:20px">Here\'s where <span class="esa-hl">to start.</span></h1>' +
      '<p style="margin-top:24px;font-family:Chivo,sans-serif;font-weight:700;font-size:clamp(1.3rem,2.4vw,1.8rem);line-height:1.35;letter-spacing:-0.02em;max-width:820px">Your top three areas to work on are ' + esc(top[0].a.phrase) + ', ' + esc(top[1].a.phrase) + ' and ' + esc(top[2].a.phrase) + '.</p>' +
      (hrs ? '<p style="margin-top:18px;font-size:clamp(1.02rem,1.6vw,1.15rem);line-height:1.7;color:rgba(242,225,205,0.8);max-width:680px">You told me you spend ' + esc(hrs) + ' a week on admin. These are the places where automating the routine parts will give you the most of that time back, so you can spend it on the bits your clients really notice.</p>' : '') +
      '</div></section>';
    h += '<section class="esa-sec esa-cream"><div class="esa-wrap"><h2 style="font-size:clamp(2rem,4.4vw,3.4rem);line-height:1.02;letter-spacing:-0.045em">Your top <span class="esa-hl">three.</span></h2><div class="esa-grid3" style="margin-top:clamp(32px,5vw,56px)">';
    top.forEach(function(x, i){
      var said = x.a.qs[x.weakest][1][x.vals[x.weakest]];
      h += '<div class="esa-card' + (i === 0 ? ' first' : '') + '">' +
        '<span style="font-family:Chivo,sans-serif;font-weight:900;font-size:2.4rem;letter-spacing:-0.06em;line-height:1;color:#c75c33">0' + (i + 1) + '</span>' +
        '<h3 style="font-size:clamp(1.6rem,2.6vw,2rem);letter-spacing:-0.04em;line-height:1.05;margin-top:20px">' + esc(x.a.name) + '</h3>' +
        '<p style="margin-top:10px;font-size:0.92rem;line-height:1.55;color:rgba(42,20,12,0.6)">' + (x.picked ? 'You picked this as a priority. ' : '') + esc(x.a.qs[x.weakest][0]) + ' You said: “' + esc(said) + '”</p>' +
        '<div class="blk"><span class="lab">Automate</span><p style="margin-top:6px">' + esc(x.a.auto) + '</p></div>' +
        '<div class="blk" style="flex:1"><span class="lab">Your human touch</span><p style="margin-top:6px">' + esc(x.a.human) + '</p></div>' +
        '<a class="esa-vid" href="' + vid(x.a.id) + '"><span>▶  ' + esc(x.a.video) + '</span><span>→</span></a></div>';
    });
    h += '</div></div></section>';
    var plan = PLAN === 'annual'
      ? '<span style="font-size:0.7rem;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#e0835c">Spark Plus</span><h3 style="font-size:clamp(1.6rem,2.6vw,2.1rem);letter-spacing:-0.04em;line-height:1.05;margin-top:14px">I\'ll go through this with you.</h3><p style="margin-top:12px;font-size:1rem;line-height:1.7;color:rgba(242,225,205,0.85)">I\'ll personally review your answers and send you a setup plan tailored to you, with what I\'d set up first and ideas for your business.</p>'
      : '<span style="font-size:0.7rem;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#e0835c">Want my eyes on this?</span><h3 style="font-size:clamp(1.6rem,2.6vw,2.1rem);letter-spacing:-0.04em;line-height:1.05;margin-top:14px">Upgrade to Spark Plus.</h3><p style="margin-top:12px;font-size:1rem;line-height:1.7;color:rgba(242,225,205,0.85)">On Spark Plus I personally review your audit and send you a setup plan tailored to you, with what I\'d set up first and ideas for your business.</p><div style="display:flex;margin-top:24px"><a class="esa-btn" style="min-height:52px;padding:0 26px" href="' + (UPGRADE_URL || '#') + '">Upgrade to Spark Plus</a></div>';
    h += '<section class="esa-sec"><div class="esa-wrap" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(32px,5vw,64px);align-items:start"><div>' +
      '<h2 style="font-size:clamp(2rem,4.4vw,3.2rem);line-height:1.02;letter-spacing:-0.045em">Then work through <span class="esa-hl">the rest.</span></h2>' +
      '<p style="margin-top:16px;font-size:1rem;line-height:1.7;color:rgba(242,225,205,0.75);max-width:460px">Once your top three are running, carry on down the list in this order.</p>' +
      '<div style="display:flex;flex-direction:column;margin-top:28px;border-top:1px solid rgba(242,225,205,0.12)">';
    rest.forEach(function(x, i){
      h += '<a class="esa-row" href="' + vid(x.a.id) + '"><span style="flex:none;width:28px;font-family:Chivo,sans-serif;font-weight:900;color:#c75c33">' + String(i + 4).padStart(2, '0') + '</span><span style="flex:1;display:flex;flex-direction:column"><span style="font-family:Chivo,sans-serif;font-weight:700;font-size:1.05rem;line-height:1.3">' + esc(x.a.name) + '</span><span style="font-size:0.85rem;line-height:1.4;color:rgba(242,225,205,0.6)">' + esc(x.a.video) + '</span></span><span style="flex:none">→</span></a>';
    });
    h += '</div></div><div class="esa-plan">' + plan + '</div></div></section>';
    h += '<section class="esa-cta"><div style="max-width:760px;margin:0 auto">' +
      '<h2 style="font-size:clamp(2.2rem,5vw,4.2rem);line-height:1;letter-spacing:-0.045em;color:#f2e1cd">Time to <span style="color:#2a140c">get building.</span></h2>' +
      '<p style="margin:24px auto 0;max-width:540px;font-size:clamp(1.02rem,1.6vw,1.15rem);line-height:1.7;color:#f2e1cd">' + (CALL ? 'I\'ll go through your answers after our call and send your roadmap over with my notes.' : (EMAIL || CID) ? 'We\'ll load your account with the snapshots that fit your answers, and your roadmap is on its way to your inbox too, so you can come back to it whenever you need.' : 'Pop your details in below and we\'ll load your account with the snapshots that fit your answers, then send your roadmap to your inbox.') + '</p>' +
      (!CALL && !EMAIL && !CID ? '<form id="esa-id" style="display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:28px"><input id="esa-first" placeholder="First name" autocomplete="given-name" style="flex:1 1 180px;min-height:56px;padding:0 20px;border-radius:100px;border:none;font-family:Livvic,sans-serif;font-size:1rem;color:#2a140c"><input id="esa-email" type="email" placeholder="Email you joined with" autocomplete="email" style="flex:2 1 240px;min-height:56px;padding:0 20px;border-radius:100px;border:none;font-family:Livvic,sans-serif;font-size:1rem;color:#2a140c"><button class="esa-btn esa-btn-dark" type="submit">Send my answers →</button></form><p id="esa-id-err" hidden style="margin-top:12px;color:#2a140c;font-weight:600"></p>' : '') +
      '<div style="display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:14px 24px;margin-top:36px"><a class="esa-btn esa-btn-dark" href="' + vid(top[0].a.id) + '">Start your first video →</a><button class="esa-link" data-act="restart">Retake the audit</button></div>' +
      '</div></section>';
    return h;
  }
  function render(){
    var n = Q.length, st = Math.min(S.step, n + 1), isQ = st >= 1 && st <= n;
    S.step = st;
    root.innerHTML = header(isQ) + (st === 0 ? intro() : isQ ? question() : results());
    var ta = document.getElementById('esa-ta');
    if (ta) ta.addEventListener('input', function(){ S.ans[Q[S.step - 1].id] = ta.value; save(); });
  }
  root.addEventListener('submit', function(e){
    if (e.target.id !== 'esa-id') return;
    e.preventDefault();
    var em = document.getElementById('esa-email').value.trim(), err = document.getElementById('esa-id-err');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) { err.textContent = 'Please check your email address.'; err.hidden = false; return; }
    EMAIL = em; FIRST = document.getElementById('esa-first').value.trim();
    S.email = EMAIL; S.first = FIRST; save(); submit(); render();
  });
  root.addEventListener('click', function(e){
    var b = e.target.closest('[data-act],[data-opt]');
    if (!b) return;
    var act = b.getAttribute('data-act');
    if (act === 'start') return go(Math.max(1, Math.min(S.step || 1, Q.length)));
    if (act === 'restart') { S = { step: 1, ans: {}, sent: false }; save(); return go(1); }
    if (act === 'back') return go(S.step - 1);
    if (act === 'next') return go(S.step + 1);
    var i = +b.getAttribute('data-opt'), q = Q[S.step - 1];
    if (q.multi) {
      var cur = Array.isArray(S.ans.pick) ? S.ans.pick.slice() : [], k = cur.indexOf(i);
      if (k > -1) cur.splice(k, 1); else if (cur.length < 3) cur.push(i);
      S.ans.pick = cur; save(); render();
    } else {
      S.ans[q.id] = i; save(); render();
      setTimeout(function(){ go(S.step + 1); }, 180);
    }
  });
  render();
})();
</script>
