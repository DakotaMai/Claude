<title>Morning Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a planning desk. Left = everything on your plate, in client lanes (retainers first, ad-hoc below).
   Right = the Today column you build each morning, with a capacity bar against your available hours. */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --sunk:#e9ecf1; --ink:#161d29; --muted:#5a6475; --line:#dbe0e8;
  --sun:#f5b800; --sun-ink:#1d1600;
  --c1:#0f7b6c; --c2:#7b3fb8; --c3:#c2410c; --c4:#1f5fcf; --c5:#5d6b7e; --c0:#8a93a3;
  --crit:#c42b2b; --crit-bg:#fdecec; --warn:#9a5b00; --warn-bg:#fff3dc; --ok:#1f7a3d; --ok-bg:#e5f5ea;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131a; --surface:#161d27; --sunk:#1d2531; --ink:#e7ebf1; --muted:#9aa4b3; --line:#2a3443;
  --sun:#ffc929; --sun-ink:#1d1600;
  --c1:#3cc4ae; --c2:#b88af0; --c3:#ff8a50; --c4:#6fa2ff; --c5:#93a1b5; --c0:#6d7685;
  --crit:#ff7676; --crit-bg:#3a1c1f; --warn:#f2b552; --warn-bg:#352a14; --ok:#5fd28a; --ok-bg:#16301f;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131a; --surface:#161d27; --sunk:#1d2531; --ink:#e7ebf1; --muted:#9aa4b3; --line:#2a3443;
  --sun:#ffc929; --sun-ink:#1d1600;
  --c1:#3cc4ae; --c2:#b88af0; --c3:#ff8a50; --c4:#6fa2ff; --c5:#93a1b5; --c0:#6d7685;
  --crit:#ff7676; --crit-bg:#3a1c1f; --warn:#f2b552; --warn-bg:#352a14; --ok:#5fd28a; --ok-bg:#16301f;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:0 40px}
a{color:inherit}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--c4);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:1500px;margin:0 auto}

/* Header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-block:22px 16px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,3.4vw,38px);line-height:1.05;margin:2px 0 0;text-wrap:balance;letter-spacing:-.01em}
.top-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn[disabled]{opacity:.55;cursor:default}
.btn-sun{background:var(--sun);color:var(--sun-ink);border-color:transparent;font-weight:600;padding:9px 16px;font-size:15px}
.btn-sun:hover{filter:brightness(1.05);border-color:transparent}
.btn-sm{padding:3px 9px;font-size:12.5px;border-radius:6px}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{color:var(--ink);border-color:var(--line)}

/* Source strip */
.sources{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.src-pill{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;font-size:12.5px;max-width:100%}
.src-pill .txt{min-width:0;overflow-wrap:anywhere}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c0);flex:none}
.dot.ok{background:var(--ok)} .dot.err{background:var(--crit)} .dot.busy{background:var(--sun);animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.35}to{opacity:1}}
.notice{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13.5px}
.notice.crit{border-left-color:var(--crit)}

/* Tabs (phone) */
.tabs{display:none;gap:6px;margin-bottom:12px}
.tab{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px;font-weight:600}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Main grid */
.desk{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:20px;align-items:start}
.pane{min-width:0}

/* Filter bar */
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{flex:1 1 180px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}

.section-h{display:flex;align-items:baseline;gap:10px;margin:18px 0 10px}
.section-h h2{font-family:var(--f-display);font-weight:700;font-size:18px;margin:0}
.section-h .eyebrow{margin-left:auto}

/* Lanes */
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.lane{background:var(--sunk);border-radius:var(--r);padding:10px;min-width:0;display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--lane,var(--c0))}
.lane-h{display:flex;align-items:center;gap:8px;padding:2px 2px 4px}
.lane-h h3{font-family:var(--f-display);font-weight:700;font-size:15.5px;margin:0;min-width:0;overflow-wrap:anywhere}
.lane-h .sub{font-size:11.5px;color:var(--muted)}
.count{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.count b{color:var(--crit);font-weight:500}
.lane-empty{font-size:12.5px;color:var(--muted);padding:6px 4px}
.more{align-self:flex-start}
.adhoc{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.adhoc .lane{border-top-width:2px}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:5px;min-width:0}
.card.is-planned{opacity:.55}
.card.dragging{opacity:.4}
.card-row{display:flex;gap:8px;align-items:flex-start}
.card-title{flex:1;min-width:0;font-weight:500;text-decoration:none;overflow-wrap:anywhere}
a.card-title:hover{text-decoration:underline}
.add{flex:none;border:1px solid var(--line);background:transparent;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600;color:var(--muted)}
.add:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.add.on{background:var(--ok-bg);color:var(--ok);border-color:transparent;cursor:default}
.meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:11.5px;color:var(--muted)}
.tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.03em;border-radius:4px;padding:1px 5px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.src{font-weight:500}
.tag.crit{background:var(--crit-bg);color:var(--crit)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.new{background:var(--sun);color:var(--sun-ink)}
.ctx{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.card-acts{display:flex;flex-wrap:wrap;gap:6px}
.sendbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sendbox select{flex:1 1 160px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 6px;font-size:12.5px}

/* Today column */
.today{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 24px);overflow:auto}
.today.drop{outline:2px dashed var(--sun);outline-offset:3px}
.today h2{font-family:var(--f-display);font-weight:700;font-size:22px;margin:0}
.cap{display:flex;flex-direction:column;gap:6px}
.cap-nums{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cap-nums b{color:var(--ink);font-weight:500}
.bar{height:10px;border-radius:999px;background:var(--sunk);overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.bar .done{background:var(--ok)}
.bar .todo{background:var(--ink)}
.bar.over .todo{background:var(--crit)}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pi{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface);border-left:4px solid var(--lane,var(--c0))}
.pi.done .pi-title{text-decoration:line-through;color:var(--muted)}
.pi.over{box-shadow:0 -2px 0 var(--sun)}
.pi input[type=checkbox]{width:17px;height:17px;margin-top:2px;accent-color:var(--ok)}
.pi-main{min-width:0;display:flex;flex-direction:column;gap:4px}
.pi-title{font-weight:500;overflow-wrap:anywhere;text-decoration:none}
a.pi-title:hover{text-decoration:underline}
.pi-side{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.pi-side select{border:1px solid var(--line);background:var(--surface);border-radius:6px;font-family:var(--f-mono);font-size:11.5px;padding:2px 4px}
.mini{display:flex;gap:2px}
.mini button{border:none;background:transparent;color:var(--muted);padding:0 4px;font-size:13px;line-height:1.4;border-radius:4px}
.mini button:hover{background:var(--sunk);color:var(--ink)}
.empty-today{border:1.5px dashed var(--line);border-radius:10px;padding:18px 14px;color:var(--muted);font-size:13px;text-align:center}
.quick{display:flex;gap:6px}
.quick input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px}

/* Settings drawer */
.drawer{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 35%,transparent);display:flex;justify-content:flex-end;z-index:20}
.drawer-in{width:min(520px,100%);height:100%;background:var(--surface);overflow:auto;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;border-left:1px solid var(--line)}
.drawer h2{font-family:var(--f-display);font-size:22px;margin:0}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-weight:600;font-size:13px}
.field .hint{font-size:12px;color:var(--muted)}
.field input,.field textarea,.field select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
.grow{display:grid;grid-template-columns:minmax(0,1.1fr) 100px minmax(0,1.4fr) auto;gap:6px;align-items:center}
.grow input,.grow select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 7px;min-width:0;font-size:13px}
.grow-h{font-size:11px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:30;max-width:calc(100% - 32px)}

@media (max-width: 900px){
  .tabs{display:flex}
  .desk{grid-template-columns:minmax(0,1fr)}
  .desk[data-tab="all"] .pane-today{display:none}
  .desk[data-tab="today"] .pane-all{display:none}
  .today{position:static;max-height:none}
  .grow{grid-template-columns:minmax(0,1fr) 90px;}
  .grow .gmatch{grid-column:1 / -1}
}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" id="dateLine">Morning planning</div>
      <h1 id="hello">Build today's list</h1>
    </div>
    <div class="top-actions">
      <button class="btn btn-ghost" id="settingsBtn" type="button">Settings</button>
      <button class="btn" id="refreshCu" type="button">Refresh ClickUp</button>
      <button class="btn btn-sun" id="sweepBtn" type="button">Run morning sweep</button>
    </div>
  </header>

  <div class="sources" id="sources"></div>
  <div id="notices"></div>

  <div class="tabs" role="tablist">
    <button class="tab" id="tabAll" role="tab" aria-selected="true" type="button">Everything</button>
    <button class="tab" id="tabToday" role="tab" aria-selected="false" type="button">Today</button>
  </div>

  <main class="desk" id="desk" data-tab="all">
    <section class="pane pane-all" aria-label="Everything on your plate">
      <div class="filters">
        <button class="chip" data-filter="all" aria-pressed="true" type="button">All</button>
        <button class="chip" data-filter="due" aria-pressed="false" type="button">Overdue &amp; due this week</button>
        <button class="chip" data-filter="new" aria-pressed="false" type="button">From the sweep</button>
        <button class="chip" data-filter="progress" aria-pressed="false" type="button">In progress</button>
        <input class="search" id="search" type="search" placeholder="Search tasks" aria-label="Search tasks">
      </div>
      <div id="everything"></div>
    </section>
    <aside class="pane pane-today" aria-label="Today's list">
      <div class="today" id="today"></div>
    </aside>
  </main>
</div>
<div id="drawerHost"></div>
<div id="toastHost"></div>

<script>
(function(){
"use strict";

/* ---------- state ---------- */
const DEFAULTS = { groups: [], hidden: [], hoursAvailable: 6, gmailQuery: "in:inbox category:primary", includeTeam: false, myClickupName: "", lastSweep: null };
const S = {
  uid: null, me: null,
  settings: null, settingsLoaded: false,
  lists: [], listMap: {}, cuTasks: [], cu: { status: "idle" },
  captured: [], capLoaded: false,
  plan: { items: [] }, planLoaded: false, prevPlan: null,
  filter: "all", q: "", expanded: {}, sendOpen: null,
  sweep: { gmail: { status: "idle" }, slack: { status: "idle" }, littlebird: { status: "idle" }, ai: { status: "idle" } },
  caps: { mcp: undefined, db: undefined, sample: undefined, user: undefined }
};
let mcp = null, db = null, sample = null, userApi = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const cfg = () => Object.assign({}, DEFAULTS, S.settings || {});
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayKey = ymd(new Date());
const startOfDay = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const DAY = 86400000;
const fmtMins = (m) => { m = Math.round(m || 0); const h = Math.floor(m / 60), r = m % 60; return h ? (r ? `${h}h ${r}m` : `${h}h`) : `${r}m`; };
const norm = (s) => String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
function hash(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }

function toast(msg) {
  const host = $("toastHost");
  host.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toast._t); toast._t = setTimeout(() => { host.innerHTML = ""; }, 3200);
}

/* ---------- capability helpers ---------- */
function use(name) {
  try { return (window.claude && window.claude.use) ? window.claude.use(name).catch(() => null) : Promise.resolve(null); }
  catch (e) { return Promise.resolve(null); }
}

function errText(e, server) {
  const c = e && e.code;
  switch (c) {
    case "needs_reauth": return `${server} needs reconnecting. Reconnect it in claude.ai Settings → Connectors, then try again.`;
    case "server_not_connected": case "selection_required": case "server_not_found":
      return `${server} isn't connected. Add it in claude.ai Settings → Connectors.`;
    case "not_in_manifest": return `${server} is switched off for this page. Turn it on in the page's Permissions menu.`;
    case "approval_required": case "consent_required": return `${server} is waiting for your OK. Run it again and choose Allow.`;
    case "blocked_by_policy": return `Your organisation blocks this ${server} action.`;
    case "server_unavailable": return `${server} didn't answer. Give it a minute and try again.`;
    case "tool_error": return `${server} said: ${e.message || "the request failed"}`;
    case "not_granted": case "capability_disabled": case "capability_removed":
      return "Connectors aren't available in this view. Open the page inside claude.ai.";
    default: return `${server} failed: ${(e && e.message) || "unknown error"}`;
  }
}

async function read(server, tool, input, opts) {
  try { return await mcp.callTool(server, tool, input, opts); }
  catch (e) {
    if (e && e.retryable) {
      await new Promise(r => setTimeout(r, (e.retryAfterMs || 800) + Math.random() * 700));
      return await mcp.callTool(server, tool, input, opts);
    }
    throw e;
  }
}

/* ---------- db paths & writes ---------- */
const P = {
  settings: () => `data/users/${S.uid}/settings`,
  inbox: () => `data/users/${S.uid}/inbox/items`,
  plans: () => `data/users/${S.uid}/days/plans`,
  plan: (d) => `data/users/${S.uid}/days/plans/${d}`
};
let planQueue = Promise.resolve();
function savePlan() {
  if (!db || !S.uid) return;
  const snapshot = { date: todayKey, items: S.plan.items.map(x => Object.assign({}, x)), updatedAt: new Date().toISOString() };
  planQueue = planQueue.then(() => db.doc(P.plan(todayKey)).set(snapshot)).catch(e => toast(`Couldn't save today's list: ${e.message || e.code}`));
}
let setQueue = Promise.resolve();
function saveSettings(patch) {
  S.settings = Object.assign({}, cfg(), patch);
  if (!db || !S.uid) return Promise.resolve();
  const data = Object.assign({}, S.settings);
  setQueue = setQueue.then(() => db.doc(P.settings()).set(data)).catch(e => toast(`Couldn't save settings: ${e.message || e.code}`));
  return setQueue;
}
function updateCaptured(id, patch) {
  const it = S.captured.find(c => c.id === id); if (it) Object.assign(it, patch);
  if (db && S.uid) db.doc(`${P.inbox()}/${id}`).update(patch).catch(e => toast(`Couldn't update item: ${e.message || e.code}`));
}

/* ---------- ClickUp structure ---------- */
function buildListMap(payload) {
  const root = payload && payload.hierarchy && payload.hierarchy.root;
  const lists = [], map = {};
  (root && root.children || []).forEach(space => {
    if (space.type !== "space") return;
    const walk = (node, topFolder) => {
      (node.children || []).forEach(ch => {
        if (ch.type === "folder") walk(ch, topFolder || ch.name);
        else if (ch.type === "list") {
          const rec = { id: ch.id, name: ch.name, space: space.name, spaceId: space.id, group: topFolder || ch.name, inFolder: !!topFolder };
          lists.push(rec); map[ch.id] = rec;
        }
      });
    };
    walk(space, null);
  });
  S.lists = lists; S.listMap = map;
}

function groupDefFor(groupName, spaceName) {
  const g = norm(groupName), sp = norm(spaceName);
  return (cfg().groups || []).find(def => (def.match || []).some(m => { const n = norm(m); return n && (n === g || n === sp); }) || norm(def.name) === g) || null;
}
function isHidden(groupName) { return (cfg().hidden || []).some(h => norm(h) === norm(groupName)); }

async function loadClickUp(force) {
  if (!mcp) return;
  S.cu = { status: "busy" }; renderSources();
  try {
    const h = await read("ClickUp", "clickup_get_workspace_hierarchy", { max_depth: "2", limit: 50 }, { cache: { staleTime: 300000, gcTime: 86400000, refresh: !!force } });
    buildListMap(h.payload);
    const spaceIds = [...new Set(S.lists.map(l => l.spaceId))];
    let page = 0, all = [];
    for (let i = 0; i < 10; i++) {
      const input = { order_by: "updated", page, subtasks: true };
      if (spaceIds.length) input.space_ids = spaceIds;
      const r = await read("ClickUp", "clickup_filter_tasks", input, { cache: { staleTime: 120000, refresh: !!force } });
      const p = r.payload || {};
      all = all.concat(Array.isArray(p.tasks) ? p.tasks : []);
      if (!p.has_more) break;
      page = (p.next_page != null) ? p.next_page : page + 1;
    }
    S.cuTasks = all;
    S.cu = { status: "ok", at: (h.cache && h.cache.storedAt) || Date.now(), count: all.length };
  } catch (e) {
    S.cu = { status: "err", msg: errText(e, "ClickUp"), code: e && e.code };
    if (["needs_reauth", "server_not_connected", "not_in_manifest", "blocked_by_policy"].includes(e && e.code)) S.cuTasks = [];
  }
  renderAll();
}

/* ---------- building the "everything" model ---------- */
function dueInfo(ms) {
  if (!ms) return null;
  const d = new Date(Number(ms) || ms); if (isNaN(d)) return null;
  const diff = Math.round((startOfDay(d) - startOfDay(new Date())) / DAY);
  let label, tone = "";
  if (diff < 0) { label = `Overdue ${-diff}d`; tone = "crit"; }
  else if (diff === 0) { label = "Due today"; tone = "warn"; }
  else if (diff === 1) { label = "Due tomorrow"; tone = "warn"; }
  else if (diff < 7) { label = "Due " + d.toLocaleDateString(undefined, { weekday: "short" }); }
  else label = "Due " + d.toLocaleDateString(undefined, { day: "numeric", month: "short" });
  return { diff, label, tone };
}

function isMine(t) {
  const c = cfg();
  if (c.includeTeam || !c.myClickupName) return true;
  const a = t.assignees || [];
  return a.length === 0 || a.some(x => norm(x.username) === norm(c.myClickupName));
}

function buildModel() {
  const c = cfg();
  const groups = new Map();
  const ensure = (name, def, space) => {
    const key = def ? "def:" + def.name : "g:" + name;
    if (!groups.has(key)) groups.set(key, { key, name: def ? def.name : name, kind: def ? (def.kind || "retainer") : "adhoc", color: def ? def.color : 0, space: def ? "" : space, items: [] });
    return groups.get(key);
  };
  (c.groups || []).forEach(def => ensure(def.name, def));

  S.cuTasks.forEach(t => {
    if (!isMine(t)) return;
    const l = S.listMap[t.list && t.list.id] || { name: (t.list && t.list.name) || "ClickUp", group: (t.list && t.list.name) || "ClickUp", space: "" };
    if (isHidden(l.group)) return;
    const def = groupDefFor(l.group, l.space);
    const g = ensure(l.group, def, l.space !== l.group ? l.space : "");
    g.items.push({ key: "cu:" + t.id, kind: "clickup", cuId: t.id, title: t.name, url: t.url, due: dueInfo(t.due_date), status: t.status, list: l.name !== l.group ? l.name : "", updated: Number(t.date_updated) || 0, others: (t.assignees || []).filter(a => !c.myClickupName || norm(a.username) !== norm(c.myClickupName)).map(a => a.username) });
  });

  S.captured.filter(x => x.status === "open").forEach(x => {
    let def = (c.groups || []).find(d => norm(d.name) === norm(x.client) || (d.match || []).some(m => norm(m) === norm(x.client)));
    let name = def ? def.name : (x.client && norm(x.client) !== "unsorted" ? x.client : "Unsorted");
    if (!def) { const l = S.lists.find(l => norm(l.group) === norm(name)); if (l) { def = groupDefFor(l.group, l.space); if (def) name = def.name; } }
    const g = ensure(name, def, "");
    g.items.push({ key: "cap:" + x.id, kind: "captured", capId: x.id, title: x.title, url: x.sourceUrl, source: x.source, ctx: x.context, est: x.estMins, urgency: x.urgency, due: x.dueDate ? dueInfo(new Date(x.dueDate + "T12:00:00").getTime()) : null, updated: Date.parse(x.createdAt) || 0, client: name });
  });

  const rank = (it) => {
    if (it.due && it.due.diff < 0) return 0;
    if (it.due && it.due.diff <= 1) return 1;
    if (it.kind === "captured" && it.urgency === "today") return 1.5;
    if (it.due && it.due.diff < 7) return 2;
    if (it.kind === "captured") return 2.5;
    if (norm(it.status) === "in progress") return 3;
    return 4;
  };
  groups.forEach(g => g.items.sort((a, b) => rank(a) - rank(b) || ((a.due ? a.due.diff : 999) - (b.due ? b.due.diff : 999)) || b.updated - a.updated));
  return [...groups.values()];
}

function passesFilter(it) {
  if (S.q) { const q = norm(S.q); if (!norm(it.title + " " + (it.ctx || "") + " " + (it.list || "")).includes(q)) return false; }
  switch (S.filter) {
    case "due": return !!(it.due && it.due.diff < 7) || (it.kind === "captured" && it.urgency === "today");
    case "new": return it.kind === "captured";
    case "progress": return norm(it.status) === "in progress";
    default: return true;
  }
}

const laneColor = (idx) => `var(--c${[1, 2, 3, 4, 5].includes(Number(idx)) ? Number(idx) : 0})`;
function colorForGroupName(name) {

}
const inPlan = (key) => S.plan.items.some(p => p.key === key);

function listSelectHTML(id, clientName) {
  const def = (cfg().groups || []).find(d => norm(d.name) === norm(clientName));

}

function laneHTML(g, isAdhoc) {

function renderToday() {
  const host = $("today");
  const c = cfg();
  const items = S.plan.items;
  const total = items.reduce((n, i) => n + (Number(i.estMins) || 0), 0);
  const done = items.filter(i => i.done).reduce((n, i) => n + (Number(i.estMins) || 0), 0);
  const avail = (Number(c.hoursAvailable) || 6) * 60;
  const scale = Math.max(avail, total) || 1;
  const over = total > avail;
  let running = 0;
  const ordered = items.filter(i => !i.done).concat(items.filter(i => i.done));
  const rows = ordered.map(i => {
    const idx = items.indexOf(i);
    running += i.done ? 0 : (Number(i.estMins) || 0);
    const pastCap = !i.done && running > avail && (running - (Number(i.estMins) || 0)) <= avail;
    const title = i.url ? `<a class="pi-title" href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a>` : `<span class="pi-title">${esc(i.title)}</span>`;
    const est = [15, 30, 45, 60, 90, 120, 180, 240].map(m => `<option value="${m}"${Number(i.estMins) === m ? " selected" : ""}>${fmtMins(m)}</option>`).join("");
    let extra = "";
    if (i.done && i.cuId && !i.closedInCU) extra = `<button class="btn btn-sm" data-act="closecu" data-i="${idx}" type="button">Close in ClickUp</button>`;
    if (i.closedInCU) extra = `<span class="tag" style="background:var(--ok-bg);color:var(--ok)">Closed in ClickUp</span>`;
    if (!i.cuId && i.capId && S.sendOpen === "plan:" + idx) extra = `<div class="sendbox">${listSelectHTML("planList-" + idx, i.group)}<button class="btn btn-sm" data-act="sendplan" data-i="${idx}" type="button">Create</button><button class="btn btn-sm btn-ghost" data-act="sendcancel" type="button">Cancel</button></div>`;
    else if (!i.cuId && (i.capId || i.source === "manual")) extra = `<button class="btn btn-sm btn-ghost" data-act="sendplanopen" data-i="${idx}" type="button">Add to ClickUp</button>`;
    return `<li class="pi${i.done ? " done" : ""}${pastCap ? " over" : ""}" style="--lane:${colorForGroupName(i.group)}" draggable="true" data-i="${idx}">
      <input type="checkbox" id="pi-${idx}" ${i.done ? "checked" : ""} data-act="toggle" data-i="${idx}" aria-label="Mark done">
      <div class="pi-main">${title}<div class="meta"><span>${esc(i.group || "")}</span><span class="tag src">${esc(SRC[i.source] || "")}</span></div>${extra}</div>
      <div class="pi-side"><select id="est-${idx}" data-act="est" data-i="${idx}" aria-label="Time estimate">${est}</select>
      <div class="mini"><button data-act="up" data-i="${idx}" type="button" aria-label="Move up">↑</button><button data-act="down" data-i="${idx}" type="button" aria-label="Move down">↓</button><button data-act="remove" data-i="${idx}" type="button" aria-label="Remove from today">×</button></div></div>
    </li>`;
  }).join("");

  let carry = "";
  if (S.prevPlan && !items.length) {
    const left = (S.prevPlan.items || []).filter(i => !i.done);
    if (left.length) {
      const d = new Date(S.prevPlan.date + "T12:00:00").toLocaleDateString(undefined, { weekday: "long" });
      carry = `<div class="notice">${left.length} unfinished from ${esc(d)}. <button class="btn btn-sm" data-act="carry" type="button">Bring them over</button></div>`;
    }
  }
  const noDb = S.caps.db === null || (S.caps.user !== undefined && !S.uid);
  host.innerHTML = `
    <div><div class="eyebrow">${esc(new Date().toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" }))}</div><h2>Today</h2></div>
    <div class="cap">
      <div class="cap-nums"><span><b>${fmtMins(total)}</b> planned · ${fmtMins(done)} done</span><span>${fmtMins(avail)} available</span></div>
      <div class="bar${over ? " over" : ""}" role="img" aria-label="${fmtMins(total)} planned of ${fmtMins(avail)}"><span class="done" style="width:${(done / scale) * 100}%"></span><span class="todo" style="width:${((total - done) / scale) * 100}%"></span></div>
      ${over ? `<div class="ctx" style="color:var(--crit)">${fmtMins(total - avail)} over. Items after the yellow line won't fit.</div>` : ""}
    </div>
    ${noDb ? `<div class="notice">Sign in to claude.ai to save today's list. Changes here won't be kept.</div>` : ""}
    ${carry}
    ${rows ? `<ol class="plan" id="planList">${rows}</ol>` : `<div class="empty-today">Pick tasks from your lanes with <b>+ Today</b>, or drag them here.<br>Aim for about ${fmtMins(avail)} of work.</div>`}
    <form class="quick" id="quickForm"><input id="quickInput" placeholder="Add something not in the list" aria-label="Add a task to today" autocomplete="off"><button class="btn" type="submit">Add</button></form>
    ${items.some(i => i.done) ? `<button class="btn btn-sm btn-ghost" data-act="cleardone" type="button" style="align-self:flex-start">Clear finished</button>` : ""}`;
  $("tabToday").textContent = items.length ? `Today (${items.filter(i => !i.done).length})` : "Today";
}

function findItem(key) {
  for (const g of buildModel()) { const it = g.items.find(i => i.key === key); if (it) return Object.assign({ group: g.name }, it); }
  return null;
}
function addToPlan(key) {

  S.plan.items.push({ key, title: it.title, group: it.group, source: it.kind === "clickup" ? "clickup" : it.source, url: it.url || "", estMins: it.est || 30, done: false, cuId: it.cuId || null, capId: it.capId || null });

/* ---------- ClickUp writes ---------- */
async function createInClickUp(listId, title, ctx, url, dueDate) {
  const desc = [ctx, url ? `Source: ${url}` : ""].filter(Boolean).join("\n\n");
  const input = { name: title, list_id: listId, assignees: ["me"] };
  if (desc) input.markdown_description = desc;
  if (dueDate) input.due_date = dueDate;
  const r = await mcp.callTool("ClickUp", "clickup_create_task", input);
  const p = r.payload || {};
  const t = p.task || p;
  return { id: t.id || null, url: t.url || (t.id ? `https://app.clickup.com/t/${t.id}` : "") };
}

/* ---------- the sweep ---------- */
function sinceDate() {
  const c = cfg();
  const now = Date.now();
  let since = c.lastSweep ? Date.parse(c.lastSweep) - 2 * 3600000 : now - DAY;
  since = Math.min(since, now - DAY);
  since = Math.max(since, now - 7 * DAY);
  return new Date(since);
}
const gmailDate = (d) => `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())}`;
const clean = (s, n) => String(s || "").replace(/&#39;/g, "'").replace(/&amp;/g, "&").replace(/&quot;/g, '"').replace(/[͏​-‏­]/g, "").replace(/\s+/g, " ").trim().slice(0, n);
const asText = (p) => typeof p === "string" ? p : (p && typeof p.result === "string") ? p.result : (p && typeof p.results === "string") ? p.results : JSON.stringify(p || "");

async function fetchGmail(since) {
  const q = `${cfg().gmailQuery || DEFAULTS.gmailQuery} after:${gmailDate(since)}`.trim();
  const r = await read("Gmail", "search_threads", { query: q, pageSize: 40 }, { cache: false });
  const threads = (r.payload && r.payload.threads) || [];
  return threads.map(t => {
    const ms = t.messages || []; const m = ms[ms.length - 1] || {};
    return { from: m.sender, subject: clean(m.subject, 160), snippet: clean(m.snippet, 260), date: m.date, url: t.viewUrl || m.viewUrl, messages: t.messageCount };
  });
}
async function fetchSlack(since) {
  const d = new Date(since.getTime() - DAY);
  const after = ymd(d);
  const base = { limit: 20, include_context: false, sort: "timestamp", max_context_length: 500, natural_language_query: "requests, questions or tasks for me" };
  const res = await Promise.allSettled([
    read("Slack", "slack_search_public_and_private", Object.assign({}, base, { filters: `is:dm after:${after}` }), { cache: false }),
    read("Slack", "slack_search_public_and_private", Object.assign({}, base, { filters: `after:${after}`, only_my_channels: true }), { cache: false })
  ]);
  const ok = res.filter(x => x.status === "fulfilled").map(x => asText(x.value.payload).slice(0, 14000));
  if (!ok.length) throw res[0].reason;
  return ok;
}
async function fetchLittlebird(since) {
  const r = await read("Littlebird", "search_user_context", {
    search_queries: ["commitments and promises made to clients", "action items and follow-ups from meetings", "client requests with deadlines"],
    search_queries_messages: ["someone asking for something to be done", "client waiting on a reply or deliverable"],
    date_range: { start: ymd(since), end: "now" }
  }, { cache: false });
  return asText(r.payload).slice(0, 22000);
}

async function runSweep() {
  if (!mcp) return;
  const since = sinceDate();
  ["gmail", "slack", "littlebird"].forEach(k => S.sweep[k] = { status: "busy", msg: "Reading…" });
  S.sweep.ai = { status: "idle", msg: "Waiting for sources" };
  renderSources();
  const cuP = loadClickUp(true);
  const [g, s, l] = await Promise.allSettled([fetchGmail(since), fetchSlack(since), fetchLittlebird(since)]);
  S.sweep.gmail = g.status === "fulfilled" ? { status: "ok", count: g.value.length } : { status: "err", msg: errText(g.reason, "Gmail") };
  S.sweep.slack = s.status === "fulfilled" ? { status: "ok", count: s.value.length } : { status: "err", msg: errText(s.reason, "Slack") };
  S.sweep.littlebird = l.status === "fulfilled" ? { status: "ok", count: l.value.length > 200 ? 1 : 0 } : { status: "err", msg: errText(l.reason, "Littlebird") };
  renderSources();
  await cuP;
  if (![g, s, l].some(x => x.status === "fulfilled")) { S.sweep.ai = { status: "err", msg: "No sources could be read, so there was nothing to sort." }; renderSources(); return; }
  if (!sample) { S.sweep.ai = { status: "err", msg: "Claude isn't available on this page, so new items can't be extracted." }; renderSources(); return; }

  S.sweep.ai = { status: "busy", msg: "Turning messages into tasks…" }; renderSources();
  const c = cfg();
  const clientNames = [...new Set([...(c.groups || []).map(d => `${d.name}${(d.match || []).length ? ` (also: ${d.match.join(", ")})` : ""}`), ...S.lists.filter(l => !isHidden(l.group)).map(l => l.group)])];
  const existing = S.cuTasks.map(t => t.name).slice(0, 250);
  const already = S.captured.filter(x => x.status !== "dismissed").map(x => x.title).slice(0, 150);
  const who = (S.me && S.me.name) || "the user";
  const prompt = `You are helping ${who}, a freelance marketing-systems consultant, build her morning to-do list. Below are her recent emails, Slack messages and Littlebird context (screen captures and meeting notes). Extract every concrete action SHE needs to take.

Rules:
- Only real actions for ${who}: replies owed, deliverables, fixes, approvals, follow-ups she promised, calls to book. Skip newsletters, marketing, receipts, automated notifications, FYIs, and things other people will do.
- Skip anything already covered by an existing ClickUp task or an already-captured item (lists below). Same job in different words counts as covered.
- Merge duplicates that appear across sources into one task.
- title: short imperative, max 90 chars, starting with a verb (e.g. "Reply to Paula about Shopify timeline").
- client: pick the best match from the client list, using the exact name before any parenthesis. Use "Unsorted" if none fits.
- source: "gmail", "slack" or "littlebird" (where the clearest evidence is).
- sourceUrl: the email viewUrl or Slack permalink if one is given, else "".
- context: one line, max 140 chars: who asked and what they need.
- estMins: realistic estimate in minutes (5–240).
- urgency: "today" if someone is waiting or it's due within a day, "soon" for this week, "later" otherwise.
- dueDate: "YYYY-MM-DD" only if a date is stated, else null.
Return ONLY a JSON array (no prose). Return [] if there is nothing.

Today is ${new Date().toDateString()}.

CLIENTS:
${clientNames.join("\n")}

EXISTING CLICKUP TASKS:
${existing.join("\n")}

ALREADY CAPTURED:
${already.join("\n") || "(none)"}

EMAILS:
${g.status === "fulfilled" ? JSON.stringify(g.value) : "(unavailable)"}

SLACK:
${s.status === "fulfilled" ? s.value.join("\n\n---\n\n") : "(unavailable)"}

LITTLEBIRD:
${l.status === "fulfilled" ? l.value : "(unavailable)"}`;

  let items;
  try {
    items = await sample.json(prompt, { modelTier: "default", cache: false });
  } catch (e) {
    const msg = e && e.code === "not_granted" ? "Claude isn't allowed on this page. Allow it from the page's Permissions menu."
      : e && e.code === "rate_limited" ? "Claude is busy. Try the sweep again in a few minutes."
      : `Claude couldn't sort the sweep: ${(e && e.message) || "unknown error"}`;
    S.sweep.ai = { status: "err", msg }; renderSources(); return;
  }
  if (!Array.isArray(items)) items = (items && Array.isArray(items.tasks)) ? items.tasks : [];
  const seen = new Set([...S.captured.map(x => norm(x.title)), ...S.cuTasks.map(t => norm(t.name))]);
  const now = new Date().toISOString();
  const fresh = [];
  items.slice(0, 50).forEach(x => {
    if (!x || typeof x.title !== "string" || !x.title.trim()) return;
    const title = x.title.trim().slice(0, 140);
    if (seen.has(norm(title))) return; seen.add(norm(title));
    const source = ["gmail", "slack", "littlebird"].includes(x.source) ? x.source : "gmail";
    const url = typeof x.sourceUrl === "string" && /^https:\/\//.test(x.sourceUrl) ? x.sourceUrl : "";
    const est = Math.min(240, Math.max(5, Math.round(Number(x.estMins) || 30)));
    const doc = { title, client: String(x.client || "Unsorted").slice(0, 80), source, sourceUrl: url, context: String(x.context || "").slice(0, 200), estMins: est, urgency: ["today", "soon", "later"].includes(x.urgency) ? x.urgency : "soon", dueDate: /^\d{4}-\d{2}-\d{2}$/.test(x.dueDate || "") ? x.dueDate : null, status: "open", createdAt: now };
    fresh.push(Object.assign({ id: "c" + hash(source + ":" + norm(title)) }, doc));
  });
  if (db && S.uid) {
    for (const f of fresh) { const { id, ...data } = f; try { await db.doc(`${P.inbox()}/${id}`).set(data); } catch (e) { toast(`Couldn't save "${f.title}": ${e.message || e.code}`); } }
  } else {
    S.captured = S.captured.concat(fresh);
  }
  S.sweep.ai = { status: "ok", count: fresh.length };
  await saveSettings({ lastSweep: now });
  if (fresh.length) S.filter = "all";
  renderAll();
  toast(fresh.length ? `Found ${fresh.length} new task${fresh.length === 1 ? "" : "s"}. They're marked New in their client lanes.` : "Sweep done. Nothing new beyond what's already in ClickUp.");
}

/* ---------- settings drawer ---------- */
function openSettings() {
  const c = cfg();
  const groups = (c.groups || []).length ? c.groups : [{ name: "", kind: "retainer", color: 1, match: [] }];
  const folderNames = [...new Set(S.lists.map(l => l.group))].sort();
  const row = (g, i) => `<div class="grow" data-row="${i}">
      <input id="g-name-${i}" value="${esc(g.name)}" placeholder="Client name" aria-label="Client name">
      <select id="g-kind-${i}" aria-label="Lane type"><option value="retainer"${!g.kind || g.kind === "retainer" ? " selected" : ""}>Retainer</option><option value="adhoc"${g.kind === "adhoc" ? " selected" : ""}>Ad-hoc</option><option value="internal"${g.kind === "internal" ? " selected" : ""}>Own business</option></select>
      <input class="gmatch" id="g-match-${i}" value="${esc((g.match || []).join(", "))}" placeholder="ClickUp folders or spaces" aria-label="ClickUp folders or spaces" list="folderList">
      <button class="btn btn-sm btn-ghost" data-act="grow-del" data-i="${i}" type="button" aria-label="Remove">×</button>
    </div>`;
  $("drawerHost").innerHTML = `<div class="drawer" id="drawer"><div class="drawer-in" role="dialog" aria-label="Settings">
    <div class="row" style="justify-content:space-between"><h2>Settings</h2><button class="btn btn-ghost" data-act="close-settings" type="button">Close</button></div>
    <div class="field"><label>Client lanes</label><div class="hint">Each lane gathers the ClickUp folders or spaces you list, plus anything the sweep finds for that client. Retainers get the big coloured lanes at the top. Ad-hoc lanes sit below with any ClickUp folders you haven't named here.</div></div>
    <div class="grow grow-h"><span>Name</span><span>Type</span><span class="gmatch">ClickUp folders / spaces</span><span></span></div>
    <div id="growList" style="display:flex;flex-direction:column;gap:6px">${groups.map(row).join("")}</div>
    <datalist id="folderList">${folderNames.map(f => `<option value="${esc(f)}">`).join("")}</datalist>
    <button class="btn btn-sm" data-act="grow-add" type="button" style="align-self:flex-start">Add lane</button>
    <div class="field"><label for="s-hidden">Hide these folders</label><input id="s-hidden" value="${esc((c.hidden || []).join(", "))}"><span class="hint">Comma-separated, e.g. template folders.</span></div>
    <div class="field"><label for="s-hours">Hours of focused work per day</label><input id="s-hours" type="number" min="1" max="14" step="0.5" value="${esc(c.hoursAvailable)}"></div>
    <div class="field"><label for="s-me">Your name in ClickUp</label><input id="s-me" value="${esc(c.myClickupName)}"><span class="hint">Used to hide tasks assigned only to your team.</span></div>
    <div class="field"><label><input type="checkbox" id="s-team" ${c.includeTeam ? "checked" : ""}> Show your team's tasks too</label></div>
    <div class="field"><label for="s-gmail">Which emails to sweep</label><input id="s-gmail" value="${esc(c.gmailQuery)}"><span class="hint">Gmail search. The date is added for you.</span></div>
    <div class="row"><button class="btn btn-sun" data-act="save-settings" type="button">Save settings</button></div>
  </div></div>`;
}
function readGroupRows() {
  return [...document.querySelectorAll("#growList .grow")].map(r => {
    const i = r.dataset.row;
    return { name: ($("g-name-" + i).value || "").trim(), kind: $("g-kind-" + i).value, match: ($("g-match-" + i).value || "").split(",").map(s => s.trim()).filter(Boolean) };
  });
}
function collectSettings() {
  let ri = 0;
  const groups = readGroupRows().filter(g => g.name).map(g => Object.assign(g, { color: g.kind === "internal" ? 5 : g.kind === "adhoc" ? 0 : (ri++ % 4) + 1 }));
  return {
    groups,
    hidden: ($("s-hidden").value || "").split(",").map(s => s.trim()).filter(Boolean),
    hoursAvailable: Math.min(14, Math.max(1, Number($("s-hours").value) || 6)),
    myClickupName: ($("s-me").value || "").trim(),
    includeTeam: $("s-team").checked,
    gmailQuery: ($("s-gmail").value || "").trim() || DEFAULTS.gmailQuery
  };
}

/* ---------- events ---------- */
document.addEventListener("click", async (ev) => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, i = Number(el.dataset.i);
  const items = S.plan.items;
  switch (act) {
    case "add": addToPlan(el.dataset.key); break;
    case "expand": S.expanded[el.dataset.key] = !S.expanded[el.dataset.key]; renderEverything(); break;
    case "settings": openSettings(); break;
    case "dismiss": updateCaptured(el.dataset.id, { status: "dismissed" }); renderEverything(); break;
    case "sendopen": S.sendOpen = el.dataset.id; renderEverything(); break;
    case "sendplanopen": S.sendOpen = "plan:" + i; renderToday(); break;
    case "sendcancel": S.sendOpen = null; renderEverything(); renderToday(); break;
    case "send": case "sendplan": {
      const capId = act === "send" ? el.dataset.id : items[i].capId;
      const sel = $(act === "send" ? "sendList-" + capId : "planList-" + i);
      if (!sel || !sel.value) { toast("Pick a ClickUp list first."); break; }
      const cap = S.captured.find(x => x.id === capId);
      const src = cap || items[i];
      el.disabled = true; el.textContent = "Creating…";
      try {
        const t = await createInClickUp(sel.value, src.title, cap ? cap.context : "", cap ? cap.sourceUrl : src.url, cap ? cap.dueDate : null);
        if (cap) updateCaptured(capId, { status: "sent", cuId: t.id });
        items.forEach(p => { if ((capId && p.capId === capId) || (act === "sendplan" && p === items[i])) { p.cuId = t.id; if (t.url) p.url = t.url; if (t.id) p.key = "cu:" + t.id; } });
        savePlan(); S.sendOpen = null; toast("Created in ClickUp.");
        loadClickUp(true);
      } catch (e) { toast(errText(e, "ClickUp")); el.disabled = false; el.textContent = "Create"; }
      renderEverything(); renderToday(); break;
    }
    case "up": if (i > 0) { [items[i - 1], items[i]] = [items[i], items[i - 1]]; savePlan(); renderToday(); } break;
    case "down": if (i < items.length - 1) { [items[i + 1], items[i]] = [items[i], items[i + 1]]; savePlan(); renderToday(); } break;
    case "remove": items.splice(i, 1); savePlan(); renderToday(); renderEverything(); break;
    case "cleardone": S.plan.items = items.filter(x => !x.done); savePlan(); renderToday(); renderEverything(); break;
    case "closecu": {
      el.disabled = true; el.textContent = "Closing…";
      try {
        await mcp.callTool("ClickUp", "clickup_update_task", { task_id: items[i].cuId, status: "complete" });
        items[i].closedInCU = true; savePlan(); toast("Closed in ClickUp."); loadClickUp(true);
      } catch (e) {
        toast(e && e.code === "tool_error" ? "ClickUp didn't accept the status \"complete\" for this list. Close it in ClickUp instead." : errText(e, "ClickUp"));
        el.disabled = false; el.textContent = "Close in ClickUp";
      }
      renderToday(); break;
    }
    case "carry": {
      const left = (S.prevPlan.items || []).filter(x => !x.done).map(x => Object.assign({}, x, { done: false }));
      S.plan.items = left.concat(items.filter(x => !left.some(l => l.key === x.key)));
      savePlan(); renderToday(); renderEverything(); break;
    }
    case "close-settings": $("drawerHost").innerHTML = ""; break;
    case "grow-add": {
      const rows = readGroupRows(); rows.push({ name: "", kind: "retainer", match: [] });
      const keep = cfg(); S.settings = Object.assign({}, keep, { groups: rows }); openSettings(); S.settings = keep; break;
    }
    case "grow-del": {
      const rows = readGroupRows(); rows.splice(i, 1);
      const keep = cfg(); S.settings = Object.assign({}, keep, { groups: rows }); openSettings(); S.settings = keep; break;
    }
    case "save-settings": { const patch = collectSettings(); $("drawerHost").innerHTML = ""; await saveSettings(patch); renderAll(); toast("Settings saved."); break; }
  }
});
document.addEventListener("change", (ev) => {
  const el = ev.target; const i = Number(el.dataset.i);
  if (el.dataset.act === "toggle") {
    const it = S.plan.items[i]; it.done = el.checked;
    if (it.capId) updateCaptured(it.capId, { status: el.checked ? "done" : "open" });
    savePlan(); renderToday(); renderEverything();
  } else if (el.dataset.act === "est") { S.plan.items[i].estMins = Number(el.value); savePlan(); renderToday(); }
});
document.addEventListener("submit", (ev) => {
  if (ev.target.id !== "quickForm") return;
  ev.preventDefault();
  const v = ($("quickInput").value || "").trim(); if (!v) return;
  S.plan.items.push({ key: "m:" + Date.now().toString(36), title: v, group: "", source: "manual", url: "", estMins: 30, done: false, cuId: null, capId: null });
  savePlan(); renderToday(); setTimeout(() => { const q = $("quickInput"); if (q) q.focus(); }, 0);
});
document.querySelectorAll("[data-filter]").forEach(b => b.addEventListener("click", () => {
  S.filter = b.dataset.filter;
  document.querySelectorAll("[data-filter]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  renderEverything();
}));
$("search").addEventListener("input", (e) => { S.q = e.target.value; renderEverything(); });
$("sweepBtn").addEventListener("click", runSweep);
$("refreshCu").addEventListener("click", () => loadClickUp(true));
$("settingsBtn").addEventListener("click", openSettings);
const setTab = (t) => { $("desk").dataset.tab = t; $("tabAll").setAttribute("aria-selected", String(t === "all")); $("tabToday").setAttribute("aria-selected", String(t === "today")); };
$("tabAll").addEventListener("click", () => setTab("all"));
$("tabToday").addEventListener("click", () => setTab("today"));

/* drag: cards → Today, and reorder within Today */
let drag = null;
document.addEventListener("dragstart", (e) => {
  const card = e.target.closest && e.target.closest(".card[data-key]");
  const pi = e.target.closest && e.target.closest(".pi[data-i]");
  if (card) { drag = { type: "card", key: card.dataset.key }; card.classList.add("dragging"); }
  else if (pi) { drag = { type: "plan", i: Number(pi.dataset.i) }; }
  else return;
  try { e.dataTransfer.setData("text/plain", "x"); e.dataTransfer.effectAllowed = "move"; } catch (_) {}
});
document.addEventListener("dragend", () => { drag = null; document.querySelectorAll(".dragging").forEach(x => x.classList.remove("dragging")); $("today").classList.remove("drop"); });
document.addEventListener("dragover", (e) => { if (drag && e.target.closest && e.target.closest("#today")) { e.preventDefault(); $("today").classList.add("drop"); } });
document.addEventListener("dragleave", (e) => { if (e.target.id === "today") $("today").classList.remove("drop"); });
document.addEventListener("drop", (e) => {
  if (!drag || !(e.target.closest && e.target.closest("#today"))) return;
  e.preventDefault(); $("today").classList.remove("drop");
  if (drag.type === "card") addToPlan(drag.key);
  else {
    const target = e.target.closest(".pi[data-i]");
    const items = S.plan.items; const from = drag.i; const to = target ? Number(target.dataset.i) : items.length - 1;
    if (from !== to) { const [m] = items.splice(from, 1); items.splice(to, 0, m); savePlan(); renderToday(); }
  }
  drag = null;
});

/* ---------- boot ---------- */
renderAll();
(async function boot() {
  [mcp, db, sample, userApi] = await Promise.all([use("mcp"), use("db"), use("sample"), use("user")]);
  S.caps = { mcp, db, sample, user: userApi };
  if (userApi) {
    try { S.uid = await userApi.id(); } catch (_) {}
    try { S.me = await userApi.me(); } catch (_) {}
  }
  if (db && S.uid) {
    db.doc(P.settings()).onSnapshot(snap => {
      S.settings = snap.exists ? snap.data() : null; S.settingsLoaded = true; renderAll();
    }, e => toast(`Couldn't load settings: ${e.message || e.code}`));
    db.collection(P.inbox()).where("status", "==", "open").onSnapshot(snap => {
      const sent = S.captured.filter(x => x.status !== "open");
      S.captured = snap.docs.map(d => Object.assign({ id: d.id }, d.data())).concat(sent.filter(x => !snap.docs.some(d => d.id === x.id)));
      S.capLoaded = true; renderEverything(); renderToday();
    }, e => toast(`Couldn't load swept items: ${e.message || e.code}`));
    db.doc(P.plan(todayKey)).onSnapshot(snap => {
      if (snap.metadata && snap.metadata.hasPendingWrites) return;
      S.plan = snap.exists ? Object.assign({ items: [] }, snap.data()) : { items: [] };
      S.planLoaded = true; renderToday(); renderEverything();
    }, e => toast(`Couldn't load today's list: ${e.message || e.code}`));
    db.collection(P.plans()).orderBy("date", "desc").limit(4).get().then(q => {
      const prev = q.docs.map(d => d.data()).find(d => d && d.date && d.date < todayKey);
      if (prev) { S.prevPlan = prev; renderToday(); }
    }).catch(() => {});
  }
  renderAll();
  if (mcp) loadClickUp(false);
  else { S.cu = { status: "err", msg: "Connectors aren't available in this view. Open the page inside claude.ai." }; renderAll(); }
})();
})();
</script>
