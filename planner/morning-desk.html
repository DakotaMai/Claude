<title>Morning Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a planning desk. Left = everything on your plate in client lanes (retainers, ad-hoc, passed on).
   Right = the Today column with a capacity bar. Hours meters sit under the header; a timer bar pins to the top while timing. */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --sunk:#e9ecf1; --ink:#161d29; --muted:#5a6475; --line:#dbe0e8;
  --sun:#f5b800; --sun-ink:#1d1600;
  --c1:#0f7b6c; --c2:#7b3fb8; --c3:#c2410c; --c4:#1f5fcf; --c5:#5d6b7e; --c0:#8a93a3;
  --crit:#c42b2b; --crit-bg:#fdecec; --warn:#9a5b00; --warn-bg:#fff3dc; --ok:#1f7a3d; --ok-bg:#e5f5ea;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131a; --surface:#161d27; --sunk:#1d2531; --ink:#e7ebf1; --muted:#9aa4b3; --line:#2a3443;
  --sun:#ffc929; --sun-ink:#1d1600;
  --c1:#3cc4ae; --c2:#b88af0; --c3:#ff8a50; --c4:#6fa2ff; --c5:#93a1b5; --c0:#6d7685;
  --crit:#ff7676; --crit-bg:#3a1c1f; --warn:#f2b552; --warn-bg:#352a14; --ok:#5fd28a; --ok-bg:#16301f;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131a; --surface:#161d27; --sunk:#1d2531; --ink:#e7ebf1; --muted:#9aa4b3; --line:#2a3443;
  --sun:#ffc929; --sun-ink:#1d1600;
  --c1:#3cc4ae; --c2:#b88af0; --c3:#ff8a50; --c4:#6fa2ff; --c5:#93a1b5; --c0:#6d7685;
  --crit:#ff7676; --crit-bg:#3a1c1f; --warn:#f2b552; --warn-bg:#352a14; --ok:#5fd28a; --ok-bg:#16301f;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:0 60px}
a{color:inherit}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--c4);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.wrap{max-width:1500px;margin:0 auto}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-block:22px 14px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,3.4vw,38px);line-height:1.05;margin:2px 0 0;text-wrap:balance;letter-spacing:-.01em}
.top-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn[disabled]{opacity:.55;cursor:default}
.btn-sun{background:var(--sun);color:var(--sun-ink);border-color:transparent;font-weight:600;padding:9px 16px;font-size:15px}
.btn-sun:hover{filter:brightness(1.05);border-color:transparent}
.btn-ink{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn-sm{padding:3px 9px;font-size:12.5px;border-radius:6px}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{color:var(--ink);border-color:var(--line)}

.timerbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:16;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:0 0 12px 12px;padding:8px 14px;margin-bottom:6px}
.timerbar .clock{font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums}
.timerbar .what{flex:1;min-width:0;overflow-wrap:anywhere}
.timerbar .what span{opacity:.7;font-size:12.5px}
.rec{width:10px;height:10px;border-radius:50%;background:var(--sun);animation:pulse 1.2s infinite alternate;flex:none}

.hours{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:14px}
.meter{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.meter-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.meter-h b{font-weight:600;font-size:13px;overflow-wrap:anywhere;min-width:0}
.meter-h .num{font-size:12px;color:var(--muted);white-space:nowrap}
.meter-h .num strong{color:var(--ink);font-weight:500}
.mbar{height:6px;border-radius:999px;background:var(--sunk);overflow:hidden}
.mbar span{display:block;height:100%;background:var(--lane,var(--ink))}
.mbar.over span{background:var(--crit)}
.meter .sub{font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}

.sources{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.src-pill{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;font-size:12.5px;max-width:100%}
.src-pill .txt{min-width:0;overflow-wrap:anywhere}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c0);flex:none}
.dot.ok{background:var(--ok)} .dot.err{background:var(--crit)} .dot.busy{background:var(--sun);animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.35}to{opacity:1}}
.notice{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13.5px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.notice.crit{border-left-color:var(--crit)}
.notice.sun{border-left-color:var(--sun)}

.tabs{display:none;gap:6px;margin-bottom:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);padding-block:8px}
.tab{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px;font-weight:600}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab.pulse{animation:tabpulse .9s ease 2}
@keyframes tabpulse{50%{background:var(--sun);color:var(--sun-ink);border-color:var(--sun)}}

.desk{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.pane{min-width:0}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{flex:1 1 180px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.section-h{display:flex;align-items:baseline;gap:10px;margin:18px 0 10px;flex-wrap:wrap}
.section-h h2{font-family:var(--f-display);font-weight:700;font-size:18px;margin:0}
.section-h .eyebrow{margin-left:auto}

.tray{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--sun);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.tray-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tray-h h2{font-family:var(--f-display);font-weight:700;font-size:17px;margin:0}
.sug{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;border-top:1px solid var(--line);padding-top:8px}
.sug-main{min-width:0;display:flex;flex-direction:column;gap:3px}
.sug-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sug select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:1px 4px;font-size:12px;max-width:200px}

.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.lane{background:var(--sunk);border-radius:var(--r);padding:10px;min-width:0;display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--lane,var(--c0))}
.lane-h{display:flex;align-items:center;gap:8px;padding:2px 2px 0}
.lane-h h3{font-family:var(--f-display);font-weight:700;font-size:15.5px;margin:0;min-width:0;overflow-wrap:anywhere}
.count{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.count b{color:var(--crit);font-weight:500}
.lane-tools{display:flex;gap:10px;padding:0 2px}
.lane-sel{border:none;background:transparent;color:var(--muted);font-size:11.5px;padding:0;text-decoration:underline;text-underline-offset:2px}
.lane-sel:hover{color:var(--ink)}
.lane-empty{font-size:12.5px;color:var(--muted);padding:6px 4px}
.more{align-self:flex-start}
.adhoc{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.adhoc .lane{border-top-width:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:5px;min-width:0}
.card.is-planned{opacity:.6}
.card.is-picked{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.card.is-timing{border-color:var(--sun);box-shadow:0 0 0 1px var(--sun)}
.card.dragging{opacity:.4}
.card-row{display:flex;gap:8px;align-items:flex-start}
.pick{flex:none;width:16px;height:16px;margin-top:2px;accent-color:var(--ink)}
.tlink{flex:1;min-width:0;font-weight:500;text-align:left;background:none;border:none;padding:0;overflow-wrap:anywhere;line-height:1.4}
.tlink:hover{text-decoration:underline}
.add{flex:none;border:1px solid var(--line);background:transparent;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600;color:var(--muted)}
.add:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.add.on{background:var(--ok-bg);color:var(--ok);border-color:transparent;cursor:default}
.meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:11.5px;color:var(--muted)}
.tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.03em;border-radius:4px;padding:1px 5px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.crit{background:var(--crit-bg);color:var(--crit)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.sun{background:var(--sun);color:var(--sun-ink)}
.tag.proj{background:transparent;border:1px solid var(--line);color:var(--ink)}
.ctx{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.ext{font-size:11.5px;color:var(--muted);text-decoration:none}
.ext:hover{text-decoration:underline;color:var(--ink)}
.icons{display:flex;gap:4px;margin-left:auto}
.ib{border:1px solid var(--line);background:transparent;border-radius:6px;min-width:26px;height:24px;padding:0 6px;font-size:12px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:4px}
.ib:hover{color:var(--ink);border-color:var(--muted)}
.ib.on{background:var(--sun);color:var(--sun-ink);border-color:transparent}
.ib.del:hover{color:var(--crit);border-color:var(--crit)}

.today{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 24px);overflow:auto}
.today.drop{outline:2px dashed var(--sun);outline-offset:3px}
.today h2{font-family:var(--f-display);font-weight:700;font-size:22px;margin:0}
.cap{display:flex;flex-direction:column;gap:6px}
.cap-nums{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cap-nums b{color:var(--ink);font-weight:500}
.bar{height:10px;border-radius:999px;background:var(--sunk);overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.bar .done{background:var(--ok)}
.bar .todo{background:var(--ink)}
.bar.over .todo{background:var(--crit)}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pi{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface);border-left:4px solid var(--lane,var(--c0))}
.pi.done .tlink{text-decoration:line-through;color:var(--muted)}
.pi.over{box-shadow:0 -2px 0 var(--sun)}
.pi.is-timing{border-color:var(--sun);border-left-color:var(--sun)}
.pi input[type=checkbox]{width:17px;height:17px;margin-top:2px;accent-color:var(--ok)}
.pi-main{min-width:0;display:flex;flex-direction:column;gap:4px}
.pi-side{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.pi-side select{border:1px solid var(--line);background:var(--surface);border-radius:6px;font-family:var(--f-mono);font-size:11.5px;padding:2px 4px}
.mini{display:flex;gap:2px}
.mini button{border:none;background:transparent;color:var(--muted);padding:0 4px;font-size:13px;line-height:1.4;border-radius:4px}
.mini button:hover{background:var(--sunk);color:var(--ink)}
.empty-today{border:1.5px dashed var(--line);border-radius:10px;padding:18px 14px;color:var(--muted);font-size:13px;text-align:center}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick input{flex:1 1 160px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px}
.quick select{flex:0 1 140px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px}
.today-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:12px}

.drawer{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 35%,transparent);display:flex;justify-content:flex-end;z-index:20}
.drawer-in{width:min(600px,100%);height:100%;background:var(--surface);overflow:auto;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;border-left:1px solid var(--line)}
.drawer h2{font-family:var(--f-display);font-size:22px;margin:0}
.drawer h3{font-family:var(--f-display);font-size:16px;margin:6px 0 0}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.flabel{font-weight:600;font-size:13px}
.field .hint{font-size:12px;color:var(--muted)}
.field input,.field textarea,.field select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
.field textarea{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grow{display:grid;grid-template-columns:minmax(0,1.1fr) 100px 96px minmax(0,1.2fr) 60px auto;gap:6px;align-items:center}
.grow input,.grow select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 7px;min-width:0;font-size:13px}
.grow-h{font-size:11px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.entries{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.entries li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding-block:4px}
.chk{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.chk input[type=checkbox]{margin-top:3px;width:16px;height:16px;accent-color:var(--ok);flex:none}
.chk .body{min-width:0;display:flex;flex-direction:column;gap:2px}
.chk .mins{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:70px;padding:2px 6px;font-family:var(--f-mono);font-size:12px}
.tablewrap{overflow-x:auto}
table.log{width:100%;border-collapse:collapse;font-size:13px}
table.log th{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
table.log th:first-child,table.log td:first-child{text-align:left}
table.log td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.log td:first-child{font-family:var(--f-body);white-space:normal}
table.log tr.client td{font-weight:600}
table.log tr.client td:first-child{border-left:4px solid var(--lane,var(--c0));padding-left:8px}
table.log tr.sub td{color:var(--muted);font-size:12.5px}
table.log tr.sub td:first-child{padding-left:26px}
table.log tr.total td{font-weight:600;border-top:2px solid var(--ink)}
.cal{display:flex;flex-direction:column;gap:6px}
.calrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.calrow .time{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}

.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:10px;z-index:25;max-width:calc(100% - 32px);flex-wrap:wrap;box-shadow:0 6px 24px color-mix(in srgb,var(--ink) 30%,transparent)}
.selbar .btn{border-color:transparent}
.selbar .btn-ghost{color:var(--bg);opacity:.8}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:30;max-width:calc(100% - 32px)}
.toast button{margin-left:10px;border:none;background:var(--sun);color:var(--sun-ink);border-radius:6px;padding:2px 9px;font-weight:600}

@media (max-width: 720px){
  .tabs{display:flex}
  .desk{grid-template-columns:minmax(0,1fr)}
  .desk[data-tab="all"] .pane-today{display:none}
  .desk[data-tab="today"] .pane-all{display:none}
  .today{position:static;max-height:none}
  .grow{grid-template-columns:minmax(0,1fr) 96px 60px auto}
  .grow .gbill{grid-column:1 / 2;order:5}
  .grow .gmatch{grid-column:2 / -1;order:6}
  .grow-h .gmatch,.grow-h .gbill{display:none}
  .two,.three{grid-template-columns:1fr}
}
</style>

<div class="wrap">
  <div id="timerHost"></div>
  <header class="top">
    <div>
      <div class="eyebrow" id="dateLine">Morning planning</div>
      <h1 id="hello">Build today's list</h1>
    </div>
    <div class="top-actions">
      <button class="btn btn-ghost" id="settingsBtn" type="button">Settings</button>
      <button class="btn" id="meetBtn" type="button">Log a meeting</button>
      <button class="btn" id="newBtn" type="button">New task</button>
      <button class="btn btn-sun" id="sweepBtn" type="button">Run morning sweep</button>
    </div>
  </header>

  <div class="hours" id="hours"></div>
  <div class="sources" id="sources"></div>
  <div id="notices"></div>

  <div class="tabs" role="tablist">
    <button class="tab" id="tabAll" role="tab" aria-selected="true" type="button">Everything</button>
    <button class="tab" id="tabToday" role="tab" aria-selected="false" type="button">Today</button>
  </div>

  <main class="desk" id="desk" data-tab="all">
    <section class="pane pane-all" aria-label="Everything on your plate">
      <div id="tray"></div>
      <div class="filters">
        <button class="chip" data-filter="all" aria-pressed="true" type="button">All</button>
        <button class="chip" data-filter="due" aria-pressed="false" type="button">Overdue &amp; due this week</button>
        <button class="chip" data-filter="progress" aria-pressed="false" type="button">In progress</button>
        <input class="search" id="search" type="search" placeholder="Search tasks" aria-label="Search tasks">
      </div>
      <div id="everything"></div>
    </section>
    <aside class="pane pane-today" aria-label="Today's list">
      <div class="today" id="today"></div>
    </aside>
  </main>
</div>
<div id="drawerHost"></div>
<div class="selbar" id="selbar" hidden></div>
<div id="toastHost"></div>

<script>
(function(){
"use strict";

/* ---------- state ---------- */

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------- db ---------- */
const P = {

const canSave = () => !!(db && S.uid);
const fail = (what) => (e) => toast(`Couldn't ${what}: ${(e && (e.message || e.code)) || "unknown error"}`);

function allTasks() { const m = new Map(); [...S.sets.done, ...S.sets.suggested, ...S.sets.open].forEach(t => m.set(t.id, t)); return m; }
const getTask = (id) => allTasks().get(id);
function placeLocal(t) {
  ["open", "suggested", "done"].forEach(k => { S.sets[k] = S.sets[k].filter(x => x.id !== t.id); });
  if (t.status === "open") S.sets.open.push(t);
  else if (t.status === "suggested") S.sets.suggested.push(t);
  else if (t.status === "done" && (t.doneDate || "") >= monthStart) S.sets.done.push(t);
}
function createTask(data, id) {
  id = id || newId();
  const t = Object.assign({ title: "", client: "Unsorted", project: null, due: null, estMins: 30, notes: "", status: "open", source: "manual", sourceUrl: "", context: "", urgency: null, delegatedTo: null, delegatedAt: null, inProgress: false, cuId: null, cuUrl: "", createdAt: new Date().toISOString(), doneAt: null, doneDate: null, minsLogged: 0 }, data);
  placeLocal(Object.assign({ id }, t));
  if (canSave()) return db.doc(`${P.tasks()}/${id}`).set(t).then(() => id).catch(e => { fail("save the task")(e); return id; });
  return Promise.resolve(id);
}
function updateTask(id, patch) {
  const cur = getTask(id); if (!cur) return Promise.resolve();
  Object.keys(patch).forEach(k => patch[k] === undefined && delete patch[k]);
  placeLocal(Object.assign({}, cur, patch));
  if (canSave()) return db.doc(`${P.tasks()}/${id}`).update(patch).catch(fail("update the task"));
  return Promise.resolve();
}
function setDone(id, done) {
  return updateTask(id, done ? { status: "done", doneAt: new Date().toISOString(), doneDate: todayKey, inProgress: false } : { status: "open", doneAt: null, doneDate: null });
}
let planQueue = Promise.resolve(), planPending = 0;
function savePlan() {
  if (!canSave()) return;
  const data = { date: todayKey, ids: S.plan.ids.slice(), updatedAt: new Date().toISOString() };
  planPending++;
  planQueue = planQueue.then(() => db.doc(P.plan(todayKey)).set(data)).catch(fail("save today's list")).finally(() => { planPending--; });
}
let setQueue = Promise.resolve();
function saveSettings(patch) {

function logTime(entry) {
  const e = Object.assign({ taskId: null, title: "", client: "Unsorted", project: null, kind: "work", date: todayKey, start: new Date().toISOString(), mins: 0, source: "manual", note: "", calEventId: null }, entry);

/* ---------- timer ---------- */
async function startTimer(taskId) {
  if (S.timer && S.timer.taskId === taskId) return stopTimer();
  if (S.timer && S.timer.taskId) await stopTimer(true);
  const t = getTask(taskId); if (!t) return;
  S.timer = { taskId, startedAt: new Date().toISOString() };
  if (t.status === "open" && !t.inProgress) updateTask(taskId, { inProgress: true });
  if (canSave()) db.doc(P.timer()).set(S.timer).catch(fail("start the timer"));
  renderAll();
}
async function stopTimer(quiet) {
  const tm = S.timer; if (!tm || !tm.taskId) return;
  S.timer = null;
  if (canSave()) db.doc(P.timer()).set({ taskId: null, startedAt: null }).catch(fail("stop the timer"));
  const mins = Math.round((Date.now() - Date.parse(tm.startedAt)) / 60000);
  const t = getTask(tm.taskId);
  if (mins >= 1 && t) { await logTime({ taskId: tm.taskId, title: t.title, client: t.client, project: t.project || null, start: tm.startedAt, mins, source: "timer" }); if (!quiet) toast(`Logged ${fmtMins(mins)} on ${t.title}`); }
  else if (!quiet) toast("Timer stopped. Under a minute, so nothing was logged.");
  renderAll();
}
function clockText() {
  if (!S.timer || !S.timer.startedAt) return "";
  const s = Math.max(0, Math.floor((Date.now() - Date.parse(S.timer.startedAt)) / 1000));
  return `${Math.floor(s / 3600)}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;
}
setInterval(() => { const c = $("clock"); if (c) c.textContent = clockText(); }, 1000);

/* ---------- clients ---------- */
function defFor(name) {
  const n = norm(name); if (!n) return null;
  return (cfg().groups || []).find(d => norm(d.name) === n || (d.match || []).some(m => norm(m) === n)) || null;
}
const clientName = (name) => { const d = defFor(name); return d ? d.name : (name && norm(name) !== "unsorted" ? name : "Unsorted"); };
const laneColor = (idx) => `var(--c${[1, 2, 3, 4, 5].includes(Number(idx)) ? Number(idx) : 0})`;
const colorFor = (name) => { const d = defFor(name); return laneColor(d ? d.color : 0); };
function clientNames() { return [...new Set([...(cfg().groups || []).map(g => g.name), ...[...allTasks().values()].map(t => clientName(t.client)), "Personal", "Unsorted"])]; }
function clientOptions(selected) {
  const names = clientNames(); const sel = clientName(selected || "Unsorted");
  if (!names.includes(sel)) names.push(sel);
  return names.map(n => `<option value="${esc(n)}"${n === sel ? " selected" : ""}>${esc(n)}</option>`).join("");
}
function projectsFor(client) {
  const c = clientName(client);
  return [...new Set([...[...allTasks().values()].filter(t => clientName(t.client) === c && t.project).map(t => t.project), ...S.entries.filter(e => clientName(e.client) === c && e.project).map(e => e.project)])].sort();
}
const projectList = (client) => `<datalist id="projList">${projectsFor(client).map(p => `<option value="${esc(p)}">`).join("")}</datalist>`;

function dueInfo(due) {
  if (!due) return null;
  const d = new Date(due + "T12:00:00"); if (isNaN(d)) return null;
  const diff = Math.round((startOfDay(d) - startOfDay(new Date())) / DAY);
  let label, tone = "";
  if (diff < 0) { label = `Overdue ${-diff}d`; tone = "crit"; }
  else if (diff === 0) { label = "Due today"; tone = "warn"; }
  else if (diff === 1) { label = "Due tomorrow"; tone = "warn"; }
  else if (diff < 7) label = "Due " + d.toLocaleDateString(undefined, { weekday: "short" });
  else label = "Due " + d.toLocaleDateString(undefined, { day: "numeric", month: "short" });
  return { diff, label, tone };
}
const inPlan = (id) => S.plan.ids.includes(id);
function passesFilter(t) {
  if (S.q && !norm([t.title, t.notes, t.context, t.client, t.project].join(" ")).includes(norm(S.q))) return false;
  const d = dueInfo(t.due);
  if (S.filter === "due") return !!(d && d.diff < 7) || t.urgency === "today";
  if (S.filter === "progress") return !!t.inProgress;
  return true;
}
function rank(t) {
  const d = dueInfo(t.due);
  if (d && d.diff < 0) return 0;
  if (d && d.diff <= 1) return 1;
  if (t.urgency === "today") return 1.5;
  if (d && d.diff < 7) return 2;
  if (t.inProgress) return 3;
  return 4;
}
function buildLanes() {
  const groups = new Map();
  const ensure = (name) => {
    const def = defFor(name);
    const key = def ? "def:" + def.name : "g:" + name;
    if (!groups.has(key)) groups.set(key, { key, name: def ? def.name : name, kind: def ? (def.kind || "retainer") : "adhoc", color: def ? def.color : 0, items: [] });
    return groups.get(key);
  };
  (cfg().groups || []).forEach(def => ensure(def.name));
  S.sets.open.filter(t => !t.delegatedTo).forEach(t => ensure(clientName(t.client)).items.push(t));
  groups.forEach(g => g.items.sort((a, b) => rank(a) - rank(b) || ((dueInfo(a.due) || { diff: 999 }).diff - (dueInfo(b.due) || { diff: 999 }).diff) || String(b.createdAt).localeCompare(String(a.createdAt))));
  return [...groups.values()];
}

/* ---------- rendering ---------- */
const SRC = { gmail: "Email", slack: "Slack", littlebird: "Littlebird", clickup: "ClickUp", calendar: "Calendar", manual: "" };
function cardHTML(t, opts) {

  const picked = !planned && S.sel.has(t.id);
  const d = dueInfo(t.due);
  const tags = [];
  if (t.project) tags.push(`<span class="tag proj">${esc(t.project)}</span>`);
  if (d) tags.push(`<span class="tag ${d.tone}">${esc(d.label)}</span>`);

  if (t.inProgress) tags.push(`<span class="tag">in progress</span>`);
  if (SRC[t.source]) tags.push(`<span class="tag">${esc(SRC[t.source])}</span>`);

  </article>`;
}
function laneHTML(g, isAdhoc) {

  const body = shown.map(t => cardHTML(t)).join("") || `<div class="lane-empty">${g.items.length ? "Nothing matches this filter." : "Nothing open here."}</div>`;

function tally(entries) {
  const out = {};
  entries.forEach(e => {
    const c = clientName(e.client), p = e.project || "", k = e.kind === "meeting" ? "meet" : "work", m = Number(e.mins) || 0;
    const o = out[c] = out[c] || { work: 0, meet: 0, total: 0, projects: {} };
    o[k] += m; o.total += m;
    const pp = o.projects[p] = o.projects[p] || { work: 0, meet: 0, total: 0 };
    pp[k] += m; pp.total += m;
  });
  return out;
}

function addMany(ids) {
  const added = [];
  ids.forEach(id => { const t = getTask(id); if (!t || inPlan(id)) return; if (t.status === "suggested") updateTask(id, { status: "open" }); S.plan.ids.push(id); added.push(t.title); });
  ids.forEach(id => S.sel.delete(id));
  if (added.length) savePlan();
  renderAll();
  if (!added.length) return;
  const msg = added.length === 1 ? `Added to today: ${added[0]}` : `Added ${added.length} tasks to today.`;
  if (narrow()) { const tb = $("tabToday"); tb.classList.remove("pulse"); void tb.offsetWidth; tb.classList.add("pulse"); toast(msg, { act: "gotoday", label: "View Today" }); }
  else toast(msg);
}
function deleteTasks(ids) {
  ids = ids.filter(id => getTask(id)); if (!ids.length) return;
  const one = ids.length === 1 ? getTask(ids[0]) : null;
  ids.forEach(id => { if (S.timer && S.timer.taskId === id) stopTimer(true); updateTask(id, { status: "dismissed" }); S.sel.delete(id); });
  const before = S.plan.ids.length;
  S.plan.ids = S.plan.ids.filter(x => !ids.includes(x));
  if (S.plan.ids.length !== before) savePlan();
  S.lastDeleted = ids.slice();
  renderAll();
  toast(one ? `Deleted: ${one.title}` : `Deleted ${ids.length} tasks.`, { act: "undodelmany", label: "Undo" });
}
function markDone(id) {
  const t = getTask(id); if (!t) return;
  if (S.timer && S.timer.taskId === id) stopTimer(true);

  for (const g of (cfg().groups || [])) for (const w of [g.name, ...(g.match || [])]) { const k = norm(w); if (k && k.length > 2 && n.includes(" " + k + " ")) return g.name; }
  return "";
}
function guessProject(client, text) {
  const n = " " + norm(text) + " ";
  return projectsFor(client).find(p => n.includes(" " + norm(p) + " ")) || "";
}

async function loadCalendar(date) {
  const end = ymd(new Date(new Date(date + "T12:00:00").getTime() + DAY));
  try {
    const r = await read("Google Calendar", "list_events", { startTime: `${date}T00:00:00`, endTime: `${end}T00:00:00`, orderBy: "startTime", pageSize: 50 }, { cache: { staleTime: 60000 } });
    const events = ((r.payload && r.payload.events) || []).filter(ev => ev.start && ev.start.dateTime && ev.end && ev.end.dateTime && ev.status !== "cancelled" && !(ev.attendees || []).some(a => a.self && a.responseStatus === "declined")).map(ev => {
      const s = new Date(ev.start.dateTime), e = new Date(ev.end.dateTime);
      const text = [ev.summary, ...(ev.attendees || []).map(a => a.email)].join(" ");
      const client = guessClient(text);
      return { id: ev.id, title: ev.summary || "(no title)", start: `${pad(s.getHours())}:${pad(s.getMinutes())}`, time: `${pad(s.getHours())}:${pad(s.getMinutes())}–${pad(e.getHours())}:${pad(e.getMinutes())}`, mins: Math.max(5, Math.round((e - s) / 60000)), client, project: client ? guessProject(client, text) : "" };

function buildListMap(payload) {
  const root = payload && payload.hierarchy && payload.hierarchy.root;
  const map = {};
  (root && root.children || []).forEach(space => {
    if (space.type !== "space") return;
    const walk = (node, top) => (node.children || []).forEach(ch => {
      if (ch.type === "folder") walk(ch, top || ch.name);
      else if (ch.type === "list") map[ch.id] = { id: ch.id, name: ch.name, space: space.name, spaceId: space.id, group: top || ch.name, inFolder: !!top };
    });
    walk(space, null);
  });
  return map;
}
async function importClickUp() {

    const h = await read("ClickUp", "clickup_get_workspace_hierarchy", { max_depth: "2", limit: 50 }, { cache: false });
    const lists = buildListMap(h.payload);
    const spaceIds = [...new Set(Object.values(lists).map(l => l.spaceId))];
    let page = 0, all = [];
    for (let i = 0; i < 10; i++) {
      const input = { order_by: "updated", page, subtasks: true }; if (spaceIds.length) input.space_ids = spaceIds;
      const r = await read("ClickUp", "clickup_filter_tasks", input, { cache: false });

      if (!p.has_more) break; page = p.next_page != null ? p.next_page : page + 1;
    }

    const me = norm(c.myClickupName);

    for (const t of fresh) {

      if (hidden.includes(norm(l.group))) continue;
      const byGroup = defFor(l.group), bySpace = byGroup ? null : defFor(l.space);
      const def = byGroup || bySpace;

      }

      const others = assignees.filter(a => norm(a) !== me);
      const notes = [l.name && l.name !== l.group && !project ? `ClickUp list: ${l.name}` : "", mine && others.length ? `Shared with ${others.join(", ")}` : ""].filter(Boolean).join("\n");
      await createTask({ title: t.name, client, project, due, notes, source: "clickup", cuId: t.id, cuUrl: t.url || "", inProgress: norm(t.status) === "in progress", delegatedTo, delegatedAt: delegatedTo ? new Date(Number(t.date_updated) || Date.now()).toISOString() : null });

    ${none ? `<div class="empty-today">Nothing to add. Your list and time log already match your day.</div>` : ""}
    ${r.done.length ? `<h3>Looks finished</h3>${r.done.map((x, i) => { const t = getTask(x.taskId); return `<label class="chk"><input type="checkbox" id="rv-d-${i}" checked><span class="body"><b>${esc(t ? t.title : "")}</b><span class="ctx">${esc(x.evidence || "")}</span></span></label>`; }).join("")}` : ""}
    ${work.length ? `<h3>Work time to log</h3>${work.map(timeRow).join("")}` : ""}
    ${meetings.length ? `<h3>Meetings and calls</h3>${meetings.map(timeRow).join("")}` : ""}
    ${r.newTasks.length ? `<h3>Follow-ups you mentioned</h3>${r.newTasks.map((x, i) => `<label class="chk"><input type="checkbox" id="rv-n-${i}" checked><span class="body"><b>${esc(x.title)}</b><span class="ctx">${esc(clientName(x.client))}${x.project ? " · " + esc(x.project) : ""}${x.context ? " · " + esc(x.context) : ""}</span></span></label>`).join("")}` : ""}
    ${none ? "" : `<div class="row"><button class="btn btn-sun" data-act="applyreview" type="button">Apply ticked</button></div>`}
  </div></div>`;
}
async function applyReview() {
  const r = S.review; if (!r) return;
  let d = 0, m = 0, n = 0;
  r.done.forEach((x, i) => { if ($("rv-d-" + i).checked) { setDone(x.taskId, true); d++; } });
  for (let i = 0; i < r.time.length; i++) {
    if (!$("rv-t-" + i).checked) continue;
    const x = r.time[i], mins = Math.round(Number($("rv-tm-" + i).value) || 0); if (mins < 1) continue;
    const t = x.taskId ? getTask(x.taskId) : null;
    await logTime({ taskId: x.taskId, title: t ? t.title : (x.title || "Work"), client: clientName(t ? t.client : x.client), project: (t && t.project) || (typeof x.project === "string" && x.project ? x.project : null), kind: x.kind, calEventId: x.calEventId || null, mins, source: "littlebird", note: x.evidence || "" });
    m += mins;
  }
  const picks = r.newTasks.filter((x, i) => $("rv-n-" + i).checked).map(x => Object.assign({ source: "littlebird" }, x));
  if (picks.length) n = (await writeSuggested(picks, "littlebird")).length;
  closeDrawer(); renderAll();
  toast([d && `${d} ticked off`, m && `${fmtMins(m)} logged`, n && `${n} follow-up${n === 1 ? "" : "s"} to review`].filter(Boolean).join(" · ") || "Nothing applied.");
}

/* ---------- settings ---------- */
function openSettings(groupsOverride) {
  const c = cfg();
  const groups = groupsOverride || ((c.groups || []).length ? c.groups : [{ name: "", kind: "retainer", match: [] }]);
  const row = (g, i) => `<div class="grow" data-row="${i}">
      <input id="g-name-${i}" value="${esc(g.name)}" placeholder="Client name" aria-label="Client name">
      <select id="g-kind-${i}" aria-label="Lane type"><option value="retainer"${!g.kind || g.kind === "retainer" ? " selected" : ""}>Retainer</option><option value="adhoc"${g.kind === "adhoc" ? " selected" : ""}>Ad-hoc</option><option value="internal"${g.kind === "internal" ? " selected" : ""}>Own business</option></select>
      <select class="gbill" id="g-bill-${i}" aria-label="Billing"><option value="fixed"${g.billing !== "hourly" ? " selected" : ""}>Fixed fee</option><option value="hourly"${g.billing === "hourly" ? " selected" : ""}>Hourly</option></select>
      <input class="gmatch" id="g-match-${i}" value="${esc((g.match || []).join(", "))}" placeholder="Other names, ClickUp folders" aria-label="Other names">
      <input id="g-hours-${i}" type="number" min="0" step="0.5" value="${esc(g.hours || "")}" placeholder="h/mo" aria-label="Monthly hours">
      <button class="btn btn-sm btn-ghost" data-act="grow-del" data-i="${i}" type="button" aria-label="Remove">×</button>
    </div>`;
  $("drawerHost").innerHTML = `<div class="drawer" data-act="drawerbg"><div class="drawer-in" role="dialog" aria-label="Settings">
    <div class="row" style="justify-content:space-between"><h2>Settings</h2><button class="btn btn-ghost" data-act="closedrawer" type="button">Close</button></div>
    <div class="field"><span class="flabel">Clients</span><div class="hint">Retainers get the big coloured lanes and an hours meter. For fixed-fee retainers, h/mo is the allowance. Hourly clients show hours used with no cap. "Other names" helps the sweep and calendar recognise a client (e.g. Goat for John Mckie).</div></div>
    <div class="grow grow-h"><span>Name</span><span>Type</span><span class="gbill">Billing</span><span class="gmatch">Other names</span><span>h/mo</span><span></span></div>
    <div id="growList" style="display:flex;flex-direction:column;gap:6px">${groups.map(row).join("")}</div>
    <button class="btn btn-sm" data-act="grow-add" type="button" style="align-self:flex-start">Add client</button>
    <div class="field"><label for="s-people">People you pass work to</label><input id="s-people" value="${esc((c.people || []).join(", "))}"><span class="hint">Comma-separated first names.</span></div>
    <div class="field"><label for="s-notes">Notes for Claude</label><textarea id="s-notes" placeholder="e.g. Calls with Jess are Leighton work">${esc(c.notes || "")}</textarea><span class="hint">The morning sweep and day check read these when deciding which client something belongs to.</span></div>
    <div class="field"><label for="s-hours">Hours of focused work per day</label><input id="s-hours" type="number" min="1" max="14" step="0.5" value="${esc(c.hoursAvailable)}"></div>
    <div class="field"><label for="s-gmail">Which emails to sweep</label><input id="s-gmail" value="${esc(c.gmailQuery)}"><span class="hint">Gmail search. The date is added for you.</span></div>
    <h3>ClickUp</h3>
    <div class="field"><label for="s-me">Your name in ClickUp</label><input id="s-me" value="${esc(c.myClickupName)}"><span class="hint">Tasks assigned only to someone else are imported into Passed on.</span></div>
    <div class="field"><label for="s-hidden">Skip these ClickUp folders</label><input id="s-hidden" value="${esc((c.hidden || []).join(", "))}"></div>
    <div class="row"><button class="btn btn-sm" data-act="import" type="button" ${mcp ? "" : "disabled"}>${c.clickupImportedAt ? "Import anything new from ClickUp" : "Import from ClickUp"}</button>${c.clickupImportedAt ? `<span class="ctx">Last imported ${esc(new Date(c.clickupImportedAt).toLocaleDateString())}. Tasks already imported are skipped.</span>` : ""}</div>
    <div class="row"><button class="btn btn-sun" data-act="save-settings" type="button">Save settings</button></div>
  </div></div>`;
}
function readGroupRows() {
  return [...document.querySelectorAll("#growList .grow")].map(r => {
    const i = r.dataset.row;
    return { name: ($("g-name-" + i).value || "").trim(), kind: $("g-kind-" + i).value, billing: $("g-bill-" + i).value, match: ($("g-match-" + i).value || "").split(",").map(s => s.trim()).filter(Boolean), hours: Number($("g-hours-" + i).value) || null };
  });
}
function collectSettings() {
  let ri = 0;
  const groups = readGroupRows().filter(g => g.name).map(g => Object.assign(g, { color: g.kind === "internal" ? 5 : g.kind === "adhoc" ? 0 : (ri++ % 4) + 1 }));
  return {
    groups,
    people: ($("s-people").value || "").split(",").map(s => s.trim()).filter(Boolean),
    hidden: ($("s-hidden").value || "").split(",").map(s => s.trim()).filter(Boolean),
    hoursAvailable: Math.min(14, Math.max(1, Number($("s-hours").value) || 6)),
    myClickupName: ($("s-me").value || "").trim(),
    gmailQuery: ($("s-gmail").value || "").trim() || DEFAULTS.gmailQuery,
    notes: ($("s-notes").value || "").trim()
  };
}

/* ---------- events ---------- */
const setTab = (t) => { $("desk").dataset.tab = t; $("tabAll").setAttribute("aria-selected", String(t === "all")); $("tabToday").setAttribute("aria-selected", String(t === "today")); };
document.addEventListener("click", async (ev) => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id, i = Number(el.dataset.i);
  if (act === "drawerbg" && ev.target !== el) return;
  switch (act) {
    case "add": addMany([id]); break;
    case "addsel": addMany([...S.sel]); break;
    case "donesel": { const ids = [...S.sel]; ids.forEach(x => setDone(x, true)); S.sel.clear(); renderAll(); toast(`Marked ${ids.length} done.`); break; }
    case "clearsel": S.sel.clear(); renderAll(); break;
    case "selall": {
      const g = buildLanes().find(x => x.key === el.dataset.key); if (!g) break;
      const ids = g.items.filter(passesFilter).filter(t => !inPlan(t.id)).map(t => t.id);
      const on = ids.every(x => S.sel.has(x)); ids.forEach(x => on ? S.sel.delete(x) : S.sel.add(x));
      renderEverything(); renderSelBar(); break;
    }
    case "expand": S.expanded[el.dataset.key] = !S.expanded[el.dataset.key]; renderEverything(); break;
    case "edit": openTask(id); break;
    case "newin": openTask(null, { client: el.dataset.client }); break;
    case "timer": startTimer(id); break;
    case "stoptimer": stopTimer(); break;
    case "done": markDone(id); break;
    case "undodone": setDone(id, false); renderAll(); $("toastHost").innerHTML = ""; break;
    case "takeback": updateTask(id, { delegatedTo: null, delegatedAt: null }); renderAll(); break;
    case "keep": updateTask(id, { status: "open", client: $("sugc-" + id) ? $("sugc-" + id).value : undefined }); renderAll(); break;
    case "keeptoday": updateTask(id, { status: "open", client: $("sugc-" + id) ? $("sugc-" + id).value : undefined }); addMany([id]); break;
    case "dismiss": updateTask(id, { status: "dismissed" }); renderAll(); break;
    case "keepall": S.sets.suggested.slice().forEach(t => updateTask(t.id, { status: "open", client: $("sugc-" + t.id) ? $("sugc-" + t.id).value : t.client })); renderAll(); break;
    case "dismissall": S.sets.suggested.slice().forEach(t => updateTask(t.id, { status: "dismissed" })); renderAll(); break;
    case "up": if (i > 0) { const a = S.plan.ids; [a[i - 1], a[i]] = [a[i], a[i - 1]]; savePlan(); renderToday(); } break;
    case "down": if (i < S.plan.ids.length - 1) { const a = S.plan.ids; [a[i + 1], a[i]] = [a[i], a[i + 1]]; savePlan(); renderToday(); } break;
    case "remove": S.plan.ids.splice(i, 1); savePlan(); renderAll(); break;
    case "cleardone": S.plan.ids = S.plan.ids.filter(x => { const t = getTask(x); return t && t.status !== "done"; }); savePlan(); renderAll(); break;
    case "carry": { const left = (S.prevPlan.ids || []).filter(x => { const t = getTask(x); return t && t.status === "open"; }); S.plan.ids = left.concat(S.plan.ids.filter(x => !left.includes(x))); savePlan(); renderAll(); break; }
    case "gotoday": setTab("today"); $("toastHost").innerHTML = ""; window.scrollTo({ top: 0 }); break;
    case "check": runCheck(); break;
    case "applyreview": applyReview(); break;
    case "meeting": openMeeting(); break;
    case "calpick": { const e = S.cal && S.cal.events[i]; if (!e) break; const cur = readMeetForm(); openMeeting({ title: e.title, client: e.client || cur.client, project: e.project || "", date: S.cal.date, start: e.start, mins: e.mins, calEventId: e.id }); break; }
    case "timelog": openTimeLog(); break;
    case "logmonth": openTimeLog(el.dataset.month); break;
    case "export": exportCSV(el.dataset.month); break;
    case "import": closeDrawer(); importClickUp(); break;
    case "closedrawer": case "drawerbg": closeDrawer(); break;
    case "drawerdone": { const fid = $("taskForm").dataset.id; const t = getTask(fid); if (!t) break; if (t.status === "done") setDone(fid, false); else markDone(fid); closeDrawer(); renderAll(); break; }
    case "drawerdelete": { const fid = $("taskForm").dataset.id; updateTask(fid, { status: "dismissed" }); S.plan.ids = S.plan.ids.filter(x => x !== fid); savePlan(); closeDrawer(); renderAll(); toast("Task deleted.", { act: "undodel", id: fid, label: "Undo" }); break; }
    case "undodel": updateTask(id, { status: "open" }); renderAll(); $("toastHost").innerHTML = ""; break;
    case "del": deleteTasks([id]); break;
    case "delsel": deleteTasks([...S.sel]); break;
    case "undodelmany": (S.lastDeleted || []).forEach(x => updateTask(x, { status: "open" })); S.lastDeleted = []; renderAll(); $("toastHost").innerHTML = ""; break;
    case "logmanual": {
      const fid = $("taskForm").dataset.id; const t = getTask(fid); const mins = Math.round(Number($("f-mins").value) || 0);
      if (!t || mins < 1) { toast("Enter the minutes to log."); break; }
      await logTime({ taskId: fid, title: t.title, client: t.client, project: t.project || null, mins, date: $("f-mdate").value || todayKey, source: "manual" });
      openTask(fid); renderAll(); toast(`Logged ${fmtMins(mins)}.`); break;
    }
    case "grow-add": { const rows = readGroupRows(); rows.push({ name: "", kind: "retainer", match: [] }); openSettings(rows); break; }
    case "grow-del": { const rows = readGroupRows(); rows.splice(i, 1); openSettings(rows); break; }
    case "save-settings": { const patch = collectSettings(); closeDrawer(); await saveSettings(patch); renderAll(); toast("Settings saved."); break; }
  }
});
document.addEventListener("change", (ev) => {
  const el = ev.target, id = el.dataset.id;
  if (el.dataset.act === "pick") { el.checked ? S.sel.add(id) : S.sel.delete(id); const card = el.closest(".card"); if (card) card.classList.toggle("is-picked", el.checked); renderSelBar(); }
  else if (el.dataset.act === "toggle") { if (el.checked && S.timer && S.timer.taskId === id) stopTimer(true); setDone(id, el.checked); renderAll(); }
  else if (el.dataset.act === "est") { updateTask(id, { estMins: Number(el.value) }); renderToday(); }
  else if (el.dataset.act === "sugclient") { updateTask(id, { client: el.value }); }
  else if (el.dataset.act === "clientpick") { const dl = $("projList"); if (dl) dl.outerHTML = projectList(el.value); }
  else if (el.dataset.act === "meetdate") { S.cal = null; openMeeting(readMeetForm()); }
});
document.addEventListener("submit", async (ev) => {
  const f = ev.target;
  if (f.id === "quickForm") {
    ev.preventDefault();
    const v = ($("quickInput").value || "").trim(); if (!v) return;
    const cid = await createTask({ title: v, client: $("quickClient").value || "Unsorted" });
    S.plan.ids.push(cid); savePlan(); renderAll();
    setTimeout(() => { const q = $("quickInput"); if (q) q.focus(); }, 0);
  } else if (f.id === "taskForm") {
    ev.preventDefault();
    const fid = f.dataset.id, del = $("f-del").value || null;
    const data = { title: $("f-title").value.trim(), client: $("f-client").value, project: $("f-proj").value.trim() || null, due: $("f-due").value || null, estMins: Number($("f-est").value) || 30, notes: $("f-notes").value, inProgress: $("f-prog").checked, delegatedTo: del };
    if (!data.title) return;
    if (fid) {
      const t = getTask(fid);
      if (del && del !== t.delegatedTo) data.delegatedAt = new Date().toISOString();
      if (!del) data.delegatedAt = null;
      updateTask(fid, data);
    } else {
      if (del) data.delegatedAt = new Date().toISOString();
      const nid = await createTask(data);
      if ($("f-today") && $("f-today").checked) { S.plan.ids.push(nid); savePlan(); }
    }
    closeDrawer(); renderAll(); toast(fid ? "Saved." : "Task created.");
  } else if (f.id === "meetForm") {
    ev.preventDefault();
    const m = readMeetForm(); if (!m.title.trim()) return;
    const start = m.start ? new Date(`${m.date}T${m.start}:00`).toISOString() : new Date(`${m.date}T12:00:00`).toISOString();
    await logTime({ title: m.title.trim(), client: m.client, project: m.project.trim() || null, kind: "meeting", date: m.date, start, mins: m.mins, source: m.calEventId ? "calendar" : "manual", note: m.note, calEventId: m.calEventId });
    toast(`Logged ${fmtMins(m.mins)} meeting for ${m.client}.`);
    openMeeting({ date: m.date, client: m.client }); renderAll();
  }
});
document.querySelectorAll("[data-filter]").forEach(b => b.addEventListener("click", () => {
  S.filter = b.dataset.filter;
  document.querySelectorAll("[data-filter]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  renderEverything();
}));
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("drawerHost").innerHTML) closeDrawer(); });
$("search").addEventListener("input", (e) => { S.q = e.target.value; renderEverything(); });
$("sweepBtn").addEventListener("click", runSweep);
$("newBtn").addEventListener("click", () => openTask(null));
$("meetBtn").addEventListener("click", () => openMeeting());
$("settingsBtn").addEventListener("click", () => openSettings());
$("tabAll").addEventListener("click", () => setTab("all"));
$("tabToday").addEventListener("click", () => setTab("today"));

let drag = null;
document.addEventListener("dragstart", (e) => {
  const card = e.target.closest && e.target.closest(".card[data-id]");
  const pi = e.target.closest && e.target.closest(".pi[data-i]");
  if (card) { drag = { type: "card", id: card.dataset.id }; card.classList.add("dragging"); }
  else if (pi) drag = { type: "plan", i: Number(pi.dataset.i) };
  else return;
  try { e.dataTransfer.setData("text/plain", "x"); e.dataTransfer.effectAllowed = "move"; } catch (_) {}
});
document.addEventListener("dragend", () => { drag = null; document.querySelectorAll(".dragging").forEach(x => x.classList.remove("dragging")); $("today").classList.remove("drop"); });
document.addEventListener("dragover", (e) => { if (drag && e.target.closest && e.target.closest("#today")) { e.preventDefault(); $("today").classList.add("drop"); } });
document.addEventListener("drop", (e) => {
  if (!drag || !(e.target.closest && e.target.closest("#today"))) return;
  e.preventDefault(); $("today").classList.remove("drop");
  if (drag.type === "card") addMany([drag.id]);
  else { const target = e.target.closest(".pi[data-i]"); const a = S.plan.ids; const from = drag.i, to = target ? Number(target.dataset.i) : a.length - 1; if (from !== to) { const [m] = a.splice(from, 1); a.splice(to, 0, m); savePlan(); renderToday(); } }
  drag = null;
});

/* ---------- carry over data from the first version ---------- */
let migrated = false;
async function migrate() {
  if (migrated || !canSave() || !S.loaded.open || !S.loaded.suggested || !S.loaded.plan) return;
  migrated = true;
  try {
    const q = await db.collection(P.inbox()).where("status", "==", "open").get();
    for (const d of q.docs) {
      const x = d.data(); const id = "s" + d.id;
      if (!getTask(id)) await createTask({ title: x.title, client: clientName(x.client), source: x.source || "gmail", sourceUrl: x.sourceUrl || "", context: x.context || "", estMins: x.estMins || 30, urgency: x.urgency || "soon", due: x.dueDate || null, status: "suggested", createdAt: x.createdAt || new Date().toISOString() }, id);
      await db.doc(`${P.inbox()}/${d.id}`).update({ status: "migrated" });
    }
  } catch (_) {}
  const raw = S.planRaw;
  if (raw && Array.isArray(raw.items) && !Array.isArray(raw.ids)) {
    const ids = [];
    for (const it of raw.items) {
      let t = it.cuId ? [...allTasks().values()].find(x => x.cuId === it.cuId) : null;
      if (!t) {
        const nid = await createTask({ title: it.title, client: clientName(it.group), estMins: it.estMins || 30, source: it.source === "clickup" ? "clickup" : "manual", cuId: it.cuId || null, cuUrl: it.url || "", status: it.done ? "done" : "open", doneDate: it.done ? todayKey : null });
        t = getTask(nid);
      }
      if (t) ids.push(t.id);
    }
    S.plan.ids = ids; savePlan(); renderAll();
  }
}

/* ---------- boot ---------- */
renderAll();
(async function boot() {
  [mcp, db, sample, userApi, downloads] = await Promise.all([use("mcp"), use("db"), use("sample"), use("user"), use("downloads")]);
  S.caps = { mcp, db };
  if (userApi) { try { S.uid = await userApi.id(); } catch (_) {} try { S.me = await userApi.me(); } catch (_) {} }
  if (canSave()) {
    const tasks = db.collection(P.tasks());
    const onErr = fail("load your tasks");
    db.doc(P.settings()).onSnapshot(snap => { S.settings = snap.exists ? snap.data() : null; renderAll(); }, fail("load settings"));
    const watch = (key, q) => q.onSnapshot(snap => { S.sets[key] = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); S.loaded[key] = true; renderAll(); migrate(); }, onErr);
    watch("open", tasks.where("status", "==", "open"));
    watch("suggested", tasks.where("status", "==", "suggested"));
    tasks.where("doneDate", ">=", monthStart).onSnapshot(snap => { S.sets.done = snap.docs.map(d => Object.assign({ id: d.id }, d.data())).filter(t => t.status === "done"); S.loaded.done = true; renderAll(); }, onErr);
    db.collection(P.entries()).where("date", ">=", monthStart).onSnapshot(snap => { S.entries = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); renderAll(); }, fail("load your time log"));
    db.doc(P.timer()).onSnapshot(snap => { const d = snap.exists ? snap.data() : null; S.timer = d && d.taskId ? d : null; renderAll(); }, () => {});
    db.doc(P.plan(todayKey)).onSnapshot(snap => {
      if ((snap.metadata && snap.metadata.hasPendingWrites) || planPending > 0) return;
      const d = snap.exists ? snap.data() : null;
      S.planRaw = d; S.plan = { ids: d && Array.isArray(d.ids) ? d.ids.slice() : [] };
      S.loaded.plan = true; renderAll(); migrate();
    }, fail("load today's list"));
    db.collection(P.plans()).orderBy("date", "desc").limit(5).get().then(q => {
      const prev = q.docs.map(d => d.data()).find(d => d && d.date && d.date < todayKey && Array.isArray(d.ids));
      if (prev) { S.prevPlan = prev; renderToday(); }
    }).catch(() => {});
  }
  renderAll();
})();
})();
</script>
