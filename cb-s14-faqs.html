<style>
/* ── FAQ accordion — CSS only ── */
.cb-faqs {
  display: flex;
  flex-direction: column;
  gap: 0;
}

.cb-faq {
  border-bottom: 1px solid var(--cb-divider);
}

.cb-faq:first-child {
  border-top: 1px solid var(--cb-divider);
}

/* Hide the checkbox */
.cb-faq__toggle {
  position: absolute;
  opacity: 0;
  width: 0;
  height: 0;
  pointer-events: none;
}

/* Question label row */
.cb-faq__question {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: 22px 0;
  cursor: pointer;
  font-size: 1rem;
  font-weight: 700;
  color: var(--cb-black);
  font-family: var(--cb-font);
  user-select: none;
  transition: color 0.15s;
}

.cb-faq__question:hover {
  color: var(--cb-orange);
}

/* The + / × icon */
.cb-faq__icon {
  width: 24px;
  height: 24px;
  flex-shrink: 0;
  position: relative;
}

.cb-faq__icon::before,
.cb-faq__icon::after {
  content: '';
  position: absolute;
  background: currentColor;
  border-radius: 2px;
  transition: transform 0.2s ease, opacity 0.2s ease;
}

/* Horizontal bar */
.cb-faq__icon::before {
  width: 14px; height: 2px;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
}

/* Vertical bar */
.cb-faq__icon::after {
  width: 2px; height: 14px;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
}

/* Answer — hidden by default */
.cb-faq__answer {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease, padding 0.2s ease;
}

.cb-faq__answer p {
  padding-bottom: 24px;
  font-size: 0.975rem;
  color: var(--cb-text-mid);
  line-height: 1.75;
}

/* Checked state — show answer, rotate icon */
.cb-faq__toggle:checked ~ .cb-faq__question .cb-faq__icon::after {
  transform: translate(-50%, -50%) rotate(90deg);
  opacity: 0;
}

.cb-faq__toggle:checked ~ .cb-faq__answer {
  max-height: 600px;
}
</style>
